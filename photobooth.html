  :root {
    --ink: #0a0a0a;
    --ink-soft: #1c1c1c;
    --red: #d6001c;
    --navy: #211551;
    --white: #ffffff;
    --off-white: #f5f4ef;
    --muted: #6b6b6b;
    --line: rgba(10,10,10,0.15);
    --radius: 4px; /* 브랜드가 각진 스타일이라 라운드는 최소한으로 */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--ink);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .device {
    width: 100%;
    max-width: 520px;
    height: 100%;
    max-height: 980px;
    background: var(--off-white);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top brand bar ---------- */
  .brandbar {
    background: var(--ink);
    padding: 22px 24px 18px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    background-image:
      radial-gradient(rgba(255,255,255,0.08) 1.4px, transparent 1.4px);
    background-size: 12px 12px;
  }
  .brandbar::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 4px;
    background: var(--red);
  }
  .brand-mark {
    font-family: 'Gotham Bold', sans-serif; letter-spacing: 0.5px;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.5px;
    color: var(--white);
    line-height: 1;
  }
  .brand-sub {
    font-family: 'Gotham Bold', sans-serif; letter-spacing: 0.5px;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.6);
    margin-top: 4px;
  }
  .brand-sticker {
    position: absolute;
    top: 14px; right: 20px;
    width: 62px; height: 62px;
    border-radius: 50%;
    background: var(--red);
    border: 2.5px solid var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transform: rotate(11deg);
    box-shadow: 0 4px 0 rgba(0,0,0,0.35);
  }
  .brand-sticker span {
    font-family: 'Black Han Sans', sans-serif;
    color: white;
    font-size: 11px;
    line-height: 1.15;
    transform: rotate(-3deg);
  }

  /* ---------- Screens ---------- */
  .screen {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .screen.active { display: flex; }

  /* ===== Screen 1: name select ===== */
  #screen-name { padding: 24px 24px 20px; }
  .prompt-title {
    font-family: 'Black Han Sans', sans-serif; letter-spacing: 0.5px;
    font-weight: 700;
    font-size: 26px;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .prompt-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 4px;
    padding: 13px 16px;
    margin-bottom: 16px;
    flex-shrink: 0;
  }
  .search-box input {

    top: 4px; right: 4px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--red);

  .chip.selected::before {
    content: "";
    position: absolute;
    top: 8px; right: 8px;

  /* ===== Screen 2: camera ===== */

    background: #000;

  .vf-tr { top: 0; right: 0; border-left: none; border-bottom: none; }

  .pick-frame-num {

  .countdown-num {
    position: absolute;

    color: white;

  @keyframes countdownPop {

    35% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    55% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
  .shutter-stamp {
    position: absolute;
    top: 50%; left: 50%;

    font-size: 46px;

    background: var(--red);
    padding: 10px 26px;
    border-radius: 6px;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
  }
  .shutter-stamp.pop {
    animation: shutterPop 0.55s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes shutterPop {
    0% { transform: translate(-50%, -50%) scale(0.4) rotate(-8deg); opacity: 0; }
    40% { transform: translate(-50%, -50%) scale(1.12) rotate(-8deg); opacity: 1; }
    70% { transform: translate(-50%, -50%) scale(1) rotate(-8deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1) rotate(-8deg); opacity: 0; }
  }
  .flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 4;
  }
  .flash.on { animation: flashpop 0.28s ease-out; }
  @keyframes flashpop {
    0% { opacity: 0.95; }
    100% { opacity: 0; }
  }

  .cam-footer {
    padding: 22px 24px 26px;
    background: var(--ink);
    flex-shrink: 0;
    text-align: center;
  }
  .cam-hint {
    color: rgba(255,255,255,0.55);
    font-size: 14px;
  }

  /* ===== Screen 3: review ===== */
  #screen-review { padding: 24px; align-items: center; position: relative; }
  .confetti-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;

    position: absolute;
    top: 40%; left: 50%;
    width: 8px; height: 8px;

  }
  .confetti-piece.burst {
    animation: confettiBurst 0.9s cubic-bezier(.25,.75,.5,1) forwards;
  }
  @keyframes confettiBurst {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot)); opacity: 0; }
  }
  .review-title {
    font-family: 'Black Han Sans', sans-serif; letter-spacing: 0.5px;
    font-weight: 700;
    font-size: 24px;
    color: var(--ink);
    margin-bottom: 16px;
    align-self: flex-start;
  }
  .strip-wrap {
    background: var(--ink);
    padding: 16px;

  }

  { id: "m12", name: "배수아", phone: "010-1234-5612", time: "18:00", cls: "부트캠프" },
  { id: "m13", name: "권도현", phone: "010-1234-5613", time: "18:00", cls: "부트캠프" },
  { id: "m14", name: "홍은채", phone: "010-1234-5614", time: "19:30", cls: "리커버리" },
];

const SHOT_COUNT = 8;   // 버스트로 찍는 총 컷 수
const PICK_COUNT = 4;   // 그중 최종 선택할 컷 수
const BEHIND_INTERVAL_MS = 350; // 비하인드 영상용 프레임 캡처 간격

const state = {
  selected: [],      // { id, name, phone, cls, time, manual? }
  stream: null,
  shots: [],         // 8컷 원본 캡처 (dataURL)
  pickedIdx: [],      // 선택된 인덱스 (최대 4개)
  finalShots: [],     // 최종 선택된 4컷
  behindFrames: [],   // 촬영 세션 내내 몰래 찍은 저해상도 프레임들 (비하인드 영상 원본)
  behindTimer: null,
};

/* ===================== 화면 전환 ===================== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ===================== Screen 1: 이름 선택 (다중 선택 + 5열 칩) ===================== */
function isSelected(id) {
  return state.selected.some(m => m.id === id);
}

function toggleMember(member) {
  const idx = state.selected.findIndex(m => m.id === member.id);
  if (idx >= 0) {
    state.selected.splice(idx, 1);
  } else {
    state.selected.push(member);
  }
  renderMemberList(document.getElementById('search-input').value.trim());
  renderSelectedBar();
}

function renderMemberList(filter = "") {
  const list = document.getElementById('slot-list');
  list.innerHTML = "";
  const groups = {};
  MOCK_MEMBERS
    .filter(m => m.name.includes(filter))
    .forEach(m => {
      if (!groups[m.time]) groups[m.time] = [];
      groups[m.time].push(m);
    });

  Object.keys(groups).sort().forEach(time => {
    const label = document.createElement('div');
    label.className = 'slot-group-label';
    label.textContent = time;
    list.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'chip-grid';

    groups[time].forEach(m => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (isSelected(m.id) ? ' selected' : '');
      chip.innerHTML = `<div class="chip-name">${m.name}</div>`;
      chip.addEventListener('click', () => toggleMember(m));
      grid.appendChild(chip);
    });

    list.appendChild(grid);
  });
}

document.getElementById('search-input').addEventListener('input', (e) => {
  renderMemberList(e.target.value.trim());
});

document.getElementById('today-label').textContent =
  new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' }) + ' · 여러 명이면 다 같이 선택해주세요';

renderMemberList();

/* ===================== 번호 직접 입력 ===================== */
let manualCounter = 0;
document.getElementById('btn-manual-toggle').addEventListener('click', () => {
  document.getElementById('manual-form').classList.toggle('open');
});

document.getElementById('btn-manual-add').addEventListener('click', () => {
  const nameInput = document.getElementById('manual-name');
  const phoneInput = document.getElementById('manual-phone');
  const phone = phoneInput.value.trim();
  let name = nameInput.value.trim();

  if (!phone) {
    showError("전화번호를 입력해주세요.");
    return;
  }
  if (!/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(phone)) {
    showError("전화번호 형식을 확인해주세요. (예: 010-1234-5678)");
    return;
  }
  if (!name) {
    // 이름 없으면 전화번호 뒷자리로 대체 표시 (예: 010-1234-5678 -> 5678님)
    const digits = phone.replace(/-/g, "");
    name = digits.slice(-4);
  }

  manualCounter++;
  const member = {
    id: "manual-" + manualCounter,
    name, phone,
    cls: "직접 입력",
    time: "-",
    manual: true,
    displayOnly: !nameInput.value.trim() // 이름 직접 안 넣었으면 표시용 라벨임을 표시
  };
  state.selected.push(member);
  nameInput.value = "";
  phoneInput.value = "";
  document.getElementById('manual-form').classList.remove('open');
  hideError();
  renderSelectedBar();
});

/* ===================== 선택된 인원 요약 바 ===================== */
function renderSelectedBar() {
  const bar = document.getElementById('selected-bar');
  const btn = document.getElementById('btn-to-camera');

  if (state.selected.length === 0) {
    bar.classList.remove('show');
    bar.innerHTML = "";
    btn.disabled = true;
    btn.textContent = "촬영 시작";
    return;
  }

  bar.classList.add('show');
  bar.innerHTML = "";
  state.selected.forEach(m => {
    const pill = document.createElement('div');
    pill.className = 'selected-pill';
    const label = m.displayOnly ? `010-****-${m.name}` : m.name;
    pill.innerHTML = `<span>${label}${m.manual ? ' (직접입력)' : ''}</span>`;
    const removeBtn = document.createElement('button');
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', () => {
      state.selected = state.selected.filter(x => x.id !== m.id);
      renderMemberList(document.getElementById('search-input').value.trim());
      renderSelectedBar();
    });
    pill.appendChild(removeBtn);
    bar.appendChild(pill);
  });

  btn.disabled = false;
  btn.textContent = `촬영 시작 (${state.selected.length}명)`;
}

document.getElementById('btn-to-camera').addEventListener('click', startCameraFlow);

/* ===================== Screen 2: 카메라 ===================== */
function selectedNamesLabel() {
  const names = state.selected.map(m => m.name);
  if (names.length <= 2) return names.join(", ");
  return `${names[0]}, ${names[1]} 외 ${names.length - 2}명`;
}

async function startCameraFlow() {
  showScreen('screen-camera');
  document.getElementById('cam-name').textContent = selectedNamesLabel();
  state.shots = [];
  renderShotDots();

  const video = document.getElementById('video');
  try {
    const constraints = {
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    };
    state.stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = state.stream;
    video.style.transform = "none";
  } catch (err) {
    try {
      state.stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      video.srcObject = state.stream;
    } catch (err2) {
      showError("카메라를 불러올 수 없어요. 권한을 확인해주세요.\n(" + err2.message + ")");
      return;
    }
  }

  document.getElementById('cam-hint').textContent = "화면을 터치하면 촬영이 시작돼요 (4컷)";
  document.getElementById('screen-camera').onclick = beginCaptureSequence;
}

function renderShotDots() {
  const wrap = document.getElementById('shot-dots');
  wrap.innerHTML = "";
  for (let i = 0; i < SHOT_COUNT; i++) {
    const dot = document.createElement('div');
    dot.className = 'shot-dot' + (i < state.shots.length ? ' done' : '');
    wrap.appendChild(dot);
  }
  document.getElementById('shot-filmstrip').innerHTML = "";
}

let capturing = false;
async function beginCaptureSequence() {
  if (capturing) return;
  capturing = true;
  document.getElementById('screen-camera').onclick = null;

  // 첫 컷: 정식 카운트다운
  document.getElementById('cam-hint').textContent = "표정 준비하세요!";
  await countdownFrom(3);
  startBehindCapture(); // 여기서부터 세션 끝까지 몰래 저프레임 계속 캡처 (비하인드 영상용)
  await captureShot();
  document.getElementById('cam-hint').textContent = `1/${SHOT_COUNT}컷 · 계속 갈게요!`;

  // 나머지 컷: 카운트다운 없이 찍지만, 포즈 바꿀 시간은 충분히 줌 (기존 0.85초 → 1.8초)
  for (let i = 1; i < SHOT_COUNT; i++) {
    document.getElementById('cam-hint').textContent = "다음 포즈 준비...";
    await sleep(1300);
    document.getElementById('cam-hint').textContent = "찰칵!";
    await captureShot();
    document.getElementById('cam-hint').textContent =
      (i < SHOT_COUNT - 1) ? `${i + 1}/${SHOT_COUNT}컷 완료` : "촬영 완료!";
    await sleep(500);
  }

  await sleep(400);
  stopBehindCapture();
  stopStream();
  showPickScreen();
  capturing = false;
}

/* ---- 비하인드(제작과정) 프레임 캡처: 화면에 티 안 나게 백그라운드로 저해상도 캡처 ---- */
function startBehindCapture() {
  state.behindFrames = [];
  const video = document.getElementById('video');
  state.behindTimer = setInterval(() => {
    const c = document.createElement('canvas');
    c.width = 320; c.height = 240; // 비하인드 영상은 화질보다 용량/속도 우선이라 저해상도로
    const ctx = c.getContext('2d');
    if (video.style.transform.includes('scaleX(-1)')) {
      ctx.translate(c.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, 0, 0, c.width, c.height);
    state.behindFrames.push(c.toDataURL('image/jpeg', 0.6));
  }, BEHIND_INTERVAL_MS);
}
function stopBehindCapture() {
  clearInterval(state.behindTimer);
  state.behindTimer = null;
  // ===== 실제 연동 시 =====
  // state.behindFrames (수십~백여 장의 저해상도 이미지) 를 Oracle VM으로 전송하면,
  // 서버에서 ffmpeg로 "-r 8" 같은 저프레임 설정으로 이어붙여 짧은 mp4로 인코딩.
  // 인코딩된 mp4는 Supabase Storage에 올리고, 문자에는 그 링크만 보냄.
  console.log(`비하인드 프레임 ${state.behindFrames.length}장 캡처됨 (서버 mp4 인코딩 대상)`);
}

function countdownFrom(n) {
  return new Promise(resolve => {
    const el = document.getElementById('countdown');
    let cur = n;
    const showNum = () => {
      el.classList.remove('pop');
      void el.offsetWidth;
      el.textContent = cur;
      el.classList.add('pop');
    };
    showNum();
    const tick = setInterval(() => {
      cur -= 1;
      if (cur === 0) {
        clearInterval(tick);
        el.classList.remove('pop');
        el.textContent = '';
        resolve();
      } else {
        showNum();
      }
    }, 700);
  });
}

async function captureShot() {
  const video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  canvas.width = 640;
  canvas.height = 480;
  const ctx = canvas.getContext('2d');
  ctx.save();
  if (video.style.transform.includes('scaleX(-1)')) {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.restore();
  state.shots.push(canvas.toDataURL('image/jpeg', 0.92));

  const flash = document.getElementById('flash');
  flash.classList.remove('on');
  void flash.offsetWidth;
  flash.classList.add('on');

  playShutterSound();
  addFilmstripThumb(state.shots[state.shots.length - 1]);

  const stamp = document.getElementById('shutter-stamp');
  stamp.classList.remove('pop');
  void stamp.offsetWidth;
  stamp.classList.add('pop');

  renderShotDots();
}

function stopStream() {
  if (state.stream) {
    state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
  }
}

/* ---- 셔터음: 외부 오디오 파일 없이 WebAudio로 합성 (클릭 두 번 겹치는 카메라 셔터 느낌) ---- */
let audioCtx = null;
function playShutterSound() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [[1200, now, 0.05, 0.05], [700, now + 0.045, 0.04, 0.05]].forEach(([freq, t, dur, gain]) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = freq;
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur);
    });
  } catch (e) { /* 오디오 컨텍스트 생성 실패해도 촬영 자체엔 지장 없음 */ }
}

/* ---- 촬영 중 실시간 필름스트립 썸네일 (점 대신 실제 찍힌 사진이 쌓여서 진행상황이 체감되게) ---- */
function addFilmstripThumb(src) {
  const strip = document.getElementById('shot-filmstrip');
  const thumb = document.createElement('img');
  thumb.src = src;
  thumb.className = 'filmstrip-thumb';
  strip.appendChild(thumb);
  requestAnimationFrame(() => thumb.classList.add('in'));
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ===================== Screen 2.5: 스와이프 캐러셀에서 8컷 중 4컷 선택 ===================== */
function showPickScreen() {
  state.pickedIdx = [];
  renderPickCarousel();
  showScreen('screen-pick');
}

const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

function renderPickCarousel() {
  const carousel = document.getElementById('pick-carousel');
  const dots = document.getElementById('pick-dots');
  carousel.innerHTML = "";
  dots.innerHTML = "";

  state.shots.forEach((src, i) => {
    const selected = state.pickedIdx.includes(i);
    const card = document.createElement('div');
    card.className = 'pick-card' + (selected ? ' selected' : '');
    card.innerHTML = `
      <img src="${src}">
      <div class="pick-frame-num">${i + 1}/${SHOT_COUNT}</div>
      <div class="pick-stamp"><div class="pick-check">${CHECK_SVG}</div></div>
    `;
    card.addEventListener('click', () => togglePick(i));
    carousel.appendChild(card);

    const dot = document.createElement('div');
    dot.className = 'pick-dot';
    dots.appendChild(dot);
  });

  updatePickFooter();

  // 스크롤 위치에 따라 활성 dot 표시
  carousel.onscroll = () => {
    const cardW = carousel.firstChild ? carousel.firstChild.getBoundingClientRect().width + 16 : 1;
    const idx = Math.round(carousel.scrollLeft / cardW);
    [...dots.children].forEach((d, i) => d.classList.toggle('active', i === idx));
  };
  carousel.onscroll();
}

function updatePickFooter() {
  const btn = document.getElementById('btn-pick-confirm');
  const progress = document.getElementById('pick-progress');
  const n = state.pickedIdx.length;
  progress.innerHTML = `<b>${n}</b> / ${PICK_COUNT} 선택됨`;
  const remaining = PICK_COUNT - n;
  btn.disabled = remaining !== 0;
  btn.textContent = remaining > 0 ? `${remaining}장 더 골라주세요` : "다음";
}

function togglePick(i) {
  const idx = state.pickedIdx.indexOf(i);
  const carousel = document.getElementById('pick-carousel');
  const card = carousel.children[i];
  if (idx >= 0) {
    state.pickedIdx.splice(idx, 1);
    card.classList.remove('selected');
  } else {
    if (state.pickedIdx.length >= PICK_COUNT) {
      showError(`최대 ${PICK_COUNT}장까지만 고를 수 있어요. 다른 컷을 먼저 취소해주세요.`);
      return;
    }
    state.pickedIdx.push(i);
    card.classList.add('selected');
  }
  updatePickFooter();
}

document.getElementById('btn-pick-confirm').addEventListener('click', () => {
  state.finalShots = state.pickedIdx.map(i => state.shots[i]);
  buildComposite();
  showScreen('screen-review');
  fireConfetti();
});

function fireConfetti() {
  const layer = document.getElementById('confetti-layer');
  layer.innerHTML = "";
  const colors = ['#d6001c', '#211551', '#ffffff'];
  for (let i = 0; i < 24; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const angle = Math.random() * Math.PI * 2;
    const dist = 90 + Math.random() * 160;
    p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
    p.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
    p.style.setProperty('--rot', `${(Math.random() * 360) | 0}deg`);
    p.style.background = colors[i % colors.length];
    p.style.borderRadius = (i % 2 === 0) ? '50%' : '2px';
    layer.appendChild(p);
    requestAnimationFrame(() => p.classList.add('burst'));
  }
  setTimeout(() => { layer.innerHTML = ""; }, 1000);
}

/* ===================== Screen 3: 합성 ===================== */
function buildComposite() {
  const canvas = document.getElementById('composite-canvas');
  const ctx = canvas.getContext('2d');
  const PAD = 18;
  const GAP = 8;
  const cellW = 344;
  const cellH = cellW * 0.72;
  const headerH = 46;
  const footerH = 58;
  const W = cellW + PAD * 2;
  const H = headerH + (cellH * 4 + GAP * 3) + footerH + PAD * 2;
  canvas.width = W;
  canvas.height = H;

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);

  // 상단 브랜드 헤더 (실제 인생네컷 필름스트립처럼 로고를 맨 위에)
  ctx.textAlign = "center";
  ctx.fillStyle = "#211551";
  ctx.font = "26px 'Gotham Bold', sans-serif";
  ctx.fillText("F45 SEONGSU", W / 2, PAD + headerH * 0.62);

  const imgs = state.finalShots.map(src => {
    const img = new Image();
    img.src = src;
    return img;
  });

  let loaded = 0;
  const drawAll = () => {
    imgs.forEach((img, i) => {
      const x = PAD;
      const y = PAD + headerH + i * (cellH + GAP);
      ctx.save();
      roundRectClip(ctx, x, y, cellW, cellH, 4);
      // 중앙 크롭으로 프레임에 꽉 채우기
      const s = Math.max(cellW / img.width, cellH / img.height);
      const dw = img.width * s, dh = img.height * s;
      ctx.drawImage(img, x - (dw - cellW) / 2, y - (dh - cellH) / 2, dw, dh);
      ctx.restore();
    });
    drawOverlay(ctx, W, H, PAD, PAD + headerH + cellH * 4 + GAP * 3);
  };

  imgs.forEach(img => {
    img.onload = () => { loaded++; if (loaded === imgs.length) drawAll(); };
  });
}

function roundRectClip(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.clip();
}

function drawOverlay(ctx, W, H, pad, gridBottomY) {
  const footerTop = gridBottomY + 10;
  const footerH = H - footerTop - pad * 0.5;

  const markSize = 26;
  const markX = pad;
  const markY = footerTop + (footerH - markSize) / 2;
  ctx.fillStyle = "#211551";
  roundRectPath(ctx, markX, markY, markSize, markSize, 5);
  ctx.fill();
  ctx.font = `${markSize * 0.6}px sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("🔥", markX + markSize / 2, markY + markSize / 2 + 1);

  const textX = markX + markSize + 10;
  ctx.textAlign = "left";
  ctx.fillStyle = "#211551";
  ctx.font = "18px 'Gotham Bold', sans-serif";
  ctx.fillText("F45 SEONGSU", textX, footerTop + footerH * 0.4);

  const todayStr = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
  const clsLabel = state.selected.length ? state.selected[0].cls : "";
  ctx.fillStyle = "#6b6d78";
  ctx.font = "500 12px 'Noto Sans KR', sans-serif";
  ctx.fillText(todayStr + "  ·  " + clsLabel, textX, footerTop + footerH * 0.75);

  ctx.fillStyle = "#d6001c";
  ctx.fillRect(0, H - 5, W, 5);
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

document.getElementById('btn-retake').addEventListener('click', startCameraFlow);

document.getElementById('btn-confirm').addEventListener('click', async () => {
  showScreen('screen-done');
  document.getElementById('sending-spinner').style.display = 'block';
  document.getElementById('done-icon').style.display = 'none';
  document.getElementById('done-title').textContent = "전송하고 있어요";
  document.getElementById('done-sub').textContent = `${state.selected.length}명에게 순서대로 문자를 보내는 중이에요`;

  // ===== 실제 연동 시 여기서 =====
  // 1) canvas.toDataURL() → Supabase Storage 업로드 (1회)
  // 2) 업로드된 URL을 state.selected 각 phone 번호로 Oracle VM 릴레이 전달
  // 3) Oracle VM이 Aligo API로 각 인원에게 "링크 담긴 문자" 개별 발송
  await sleep(1800);

  document.getElementById('sending-spinner').style.display = 'none';
  document.getElementById('done-icon').style.display = 'flex';
  document.getElementById('done-title').textContent = "전송 완료!";
  const names = state.selected.map(m => m.name).join(", ");
  document.getElementById('done-sub').innerHTML =
    `<span class="done-phone">${names}</span>님 폰으로<br>사진과 촬영과정 영상 링크를 보냈어요`;

  await sleep(3500);
  resetToStart();
});

function resetToStart() {
  state.selected = [];
  state.shots = [];
  state.pickedIdx = [];
  state.finalShots = [];
  state.behindFrames = [];
  document.getElementById('search-input').value = "";
  document.getElementById('manual-form').classList.remove('open');
  renderMemberList();
  renderSelectedBar();
  showScreen('screen-name');
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.style.display = 'block';
  box.textContent = msg;
  clearTimeout(window.__errTimer);
  window.__errTimer = setTimeout(hideError, 3500);
}
function hideError() {
  document.getElementById('error-box').style.display = 'none';
}
</script>

</body>
</html>
