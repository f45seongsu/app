<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>F45 SEONGSU Photo Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #14163b;
    --navy-deep: #0b0c26;
    --red: #d5352a;
    --white: #ffffff;
    --off-white: #f2f1ec;
    --ink: #16171c;
    --muted: #6b6d78;
    --line: rgba(20,22,59,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--navy-deep);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .device {
    width: 100%;
    max-width: 520px;
    height: 100%;
    max-height: 980px;
    background: var(--off-white);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top brand bar ---------- */
  .brandbar {
    background: var(--navy);
    padding: 22px 24px 18px;
    flex-shrink: 0;
    position: relative;
  }
  .brandbar::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 4px;
    background: var(--red);
  }
  .brand-mark {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.5px;
    color: var(--white);
    line-height: 1;
  }
  .brand-sub {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.6);
    margin-top: 4px;
  }

  /* ---------- Screens ---------- */
  .screen {
    flex: 1;
    display: none;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .screen.active { display: flex; }

  /* ===== Screen 1: name select ===== */
  #screen-name { padding: 24px 24px 20px; }
  .prompt-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--navy);
    margin-bottom: 4px;
  }
  .prompt-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 16px;
    flex-shrink: 0;
  }
  .search-box input {
    border: none;
    outline: none;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    width: 100%;
    background: transparent;
    color: var(--ink);
  }
  .search-box svg { flex-shrink: 0; opacity: 0.4; }

  .slot-list { overflow-y: auto; flex: 1; margin: 0 -4px; padding: 0 4px; min-height: 0; }

  .slot-group-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--muted);
    padding: 12px 4px 8px;
  }

  /* 5개씩 들어가는 칩 그리드 */
  .chip-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
  }
  .chip {
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 10px 4px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s, background 0.15s;
    position: relative;
    overflow: hidden;
  }
  .chip:active { transform: scale(0.95); }
  .chip-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip.selected {
    border-color: var(--red);
    background: #fdf2f1;
  }
  .chip.selected .chip-name { color: var(--red); }
  .chip.selected::after {
    content: "";
    position: absolute;
    top: 4px; right: 4px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--red);
  }
  .chip.selected::before {
    content: "";
    position: absolute;
    top: 8px; right: 8px;
    width: 4px; height: 7px;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
    transform: rotate(45deg);
    z-index: 1;
  }

  /* 직접 입력 */
  .manual-toggle {
    margin-top: 14px;
    width: 100%;
    background: transparent;
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    padding: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    flex-shrink: 0;
  }
  .manual-toggle:active { transform: scale(0.99); }

  .manual-form {
    display: none;
    margin-top: 10px;
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    flex-shrink: 0;
    gap: 8px;
    flex-direction: column;
  }
  .manual-form.open { display: flex; }
  .manual-form input {
    border: 1.5px solid var(--line);
    border-radius: 9px;
    padding: 11px 13px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    color: var(--ink);
  }
  .manual-form input:focus { border-color: var(--navy); }
  .manual-form-row { display: flex; gap: 8px; }
  .manual-add-btn {
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 9px;
    padding: 11px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
  }

  /* 선택된 인원 요약 바 */
  .selected-bar {
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    flex-shrink: 0;
    max-height: 84px;
    overflow-y: auto;
  }
  .selected-bar.show { display: flex; }
  .selected-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--navy);
    color: white;
    border-radius: 999px;
    padding: 6px 8px 6px 12px;
    font-size: 13px;
    font-weight: 600;
  }
  .selected-pill button {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 18px; height: 18px;
    border-radius: 50%;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
  }

  .primary-btn {
    margin-top: 14px;
    background: var(--red);
    color: var(--white);
    border: none;
    border-radius: 14px;
    padding: 18px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.5px;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s, transform 0.1s;
  }
  .primary-btn:disabled { opacity: 0.35; pointer-events: none; }
  .primary-btn:active { transform: scale(0.98); }

  /* ===== Screen 2: camera ===== */
  #screen-camera {
    background: #000;
    position: relative;
  }
  .cam-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #000;
  }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  .cam-overlay-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 20px 20px 40px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 2;
  }
  .shot-name {
    color: white;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 19px;
    font-weight: 700;
    max-width: 320px;
  }
  .shot-dots {
    display: flex;
    gap: 7px;
    margin-top: 8px;
  }
  .shot-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
  }
  .shot-dot.done { background: var(--red); }

  /* ===== Screen 2.5: 8컷 중 4컷 선택 ===== */
  #screen-pick { padding: 22px 22px 20px; }
  .pick-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 24px;
    color: var(--navy);
    margin-bottom: 2px;
  }
  .pick-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .pick-count { color: var(--red); font-weight: 700; }
  .pick-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    flex: 1;
    overflow-y: auto;
    align-content: start;
  }
  .pick-thumb {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    border: 3px solid transparent;
    cursor: pointer;
    aspect-ratio: 4 / 3;
  }
  .pick-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pick-thumb.selected { border-color: var(--red); }
  .pick-badge {
    position: absolute;
    top: 6px; right: 6px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(20,22,59,0.55);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 14px;
  }
  .pick-thumb.selected .pick-badge { background: var(--red); }

  .countdown-num {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 130px;
    color: white;
    text-shadow: 0 4px 30px rgba(0,0,0,0.5);
    z-index: 3;
    pointer-events: none;
  }
  .flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 4;
  }
  .flash.on { animation: flashpop 0.35s ease-out; }
  @keyframes flashpop {
    0% { opacity: 0.9; }
    100% { opacity: 0; }
  }

  .cam-footer {
    padding: 22px 24px 26px;
    background: var(--navy-deep);
    flex-shrink: 0;
    text-align: center;
  }
  .cam-hint {
    color: rgba(255,255,255,0.55);
    font-size: 14px;
  }

  /* ===== Screen 3: review ===== */
  #screen-review { padding: 24px; align-items: center; }
  .review-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 24px;
    color: var(--navy);
    margin-bottom: 16px;
    align-self: flex-start;
  }
  .strip-wrap {
    background: var(--navy);
    padding: 16px;
    border-radius: 4px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    width: 100%;
    max-width: 320px;
  }
  #composite-canvas {
    width: 100%;
    display: block;
    border-radius: 2px;
  }
  .review-actions {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 320px;
    margin-top: 22px;
  }
  .review-actions .primary-btn { flex: 1.4; margin-top: 0; }
  .review-actions .secondary-btn {
    flex: 1;
    background: var(--white);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    color: var(--navy);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 17px;
    cursor: pointer;
  }

  /* ===== Screen 4: sending / done ===== */
  #screen-done {
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    gap: 6px;
  }
  .done-icon {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }
  .done-icon svg { width: 34px; height: 34px; }
  .done-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--navy);
  }
  .done-sub {
    font-size: 15px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.6;
    max-width: 320px;
  }
  .done-phone {
    font-weight: 700;
    color: var(--ink);
  }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid var(--line);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 22px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* error state */
  .error-box {
    position: absolute;
    left: 16px; right: 16px; bottom: 20px;
    z-index: 50;
    padding: 14px 16px;
    background: #fdf2f1;
    border: 1.5px solid var(--red);
    border-radius: 12px;
    color: var(--red);
    font-size: 14px;
    line-height: 1.5;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
</style>
</head>
<body>

<div class="device">

  <div class="brandbar">
    <div class="brand-mark">F45 SEONGSU</div>
    <div class="brand-sub">PHOTO BOOTH</div>
  </div>

  <!-- Screen 1: 이름 선택 -->
  <div class="screen active" id="screen-name">
    <div class="prompt-title">누가 찍나요?</div>
    <div class="prompt-sub" id="today-label">여러 명이면 다 같이 선택해주세요</div>
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14163b" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="이름 검색" autocomplete="off">
    </div>
    <div class="slot-list" id="slot-list"></div>

    <button class="manual-toggle" id="btn-manual-toggle">명단에 없나요? 번호 직접 입력 +</button>
    <div class="manual-form" id="manual-form">
      <div class="manual-form-row">
        <input type="tel" id="manual-phone" placeholder="010-0000-0000" inputmode="numeric">
        <input type="text" id="manual-name" placeholder="이름 (선택)">
      </div>
      <button class="manual-add-btn" id="btn-manual-add">추가하기</button>
    </div>

    <div class="selected-bar" id="selected-bar"></div>

    <button class="primary-btn" id="btn-to-camera" disabled>촬영 시작</button>
  </div>

  <!-- Screen 2: 촬영 -->
  <div class="screen" id="screen-camera">
    <div class="cam-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="cam-overlay-top">
        <div>
          <div class="shot-name" id="cam-name">-</div>
          <div class="shot-dots" id="shot-dots"></div>
        </div>
      </div>
      <div class="countdown-num" id="countdown" style="display:none;"></div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="cam-footer">
      <div class="cam-hint" id="cam-hint">화면을 터치하면 촬영이 시작돼요 (4컷)</div>
    </div>
  </div>

  <!-- Screen 2.5: 8컷 중 4컷 선택 -->
  <div class="screen" id="screen-pick">
    <div class="pick-title">마음에 드는 컷 <span class="pick-count" id="pick-count">4</span>장 골라주세요</div>
    <div class="pick-sub">탭해서 선택 / 다시 탭하면 취소</div>
    <div class="pick-grid" id="pick-grid"></div>
    <button class="primary-btn" id="btn-pick-confirm" disabled>다음</button>
  </div>

  <!-- Screen 3: 미리보기 -->
  <div class="screen" id="screen-review">
    <div class="review-title">이렇게 보내드릴게요</div>
    <div class="strip-wrap">
      <canvas id="composite-canvas" width="640" height="960"></canvas>
    </div>
    <div class="review-actions">
      <button class="secondary-btn" id="btn-retake">다시 찍기</button>
      <button class="primary-btn" id="btn-confirm">문자로 받기</button>
    </div>
  </div>

  <!-- Screen 4: 완료 -->
  <div class="screen" id="screen-done">
    <div class="spinner" id="sending-spinner"></div>
    <div class="done-icon" id="done-icon" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="done-title" id="done-title">전송하고 있어요</div>
    <div class="done-sub" id="done-sub">잠시만 기다려주세요</div>
  </div>

  <div class="error-box" id="error-box" style="display:none;"></div>

</div>

<script>
/* ===================== 목업 데이터 (실제로는 Glofox/Supabase에서 조회) ===================== */
const MOCK_MEMBERS = [
  { id: "m1", name: "김민수", phone: "010-1234-5601", time: "09:00", cls: "부트캠프" },
  { id: "m2", name: "이서연", phone: "010-1234-5602", time: "09:00", cls: "부트캠프" },
  { id: "m3", name: "박지훈", phone: "010-1234-5603", time: "09:00", cls: "부트캠프" },
  { id: "m4", name: "최유진", phone: "010-1234-5604", time: "09:00", cls: "부트캠프" },
  { id: "m5", name: "정하늘", phone: "010-1234-5605", time: "09:00", cls: "부트캠프" },
  { id: "m6", name: "한도윤", phone: "010-1234-5606", time: "09:00", cls: "부트캠프" },
  { id: "m7", name: "오세영", phone: "010-1234-5607", time: "10:30", cls: "하이브리드" },
  { id: "m8", name: "장서준", phone: "010-1234-5608", time: "10:30", cls: "하이브리드" },
  { id: "m9", name: "윤지아", phone: "010-1234-5609", time: "10:30", cls: "하이브리드" },
  { id: "m10", name: "임현우", phone: "010-1234-5610", time: "18:00", cls: "부트캠프" },
  { id: "m11", name: "송민재", phone: "010-1234-5611", time: "18:00", cls: "부트캠프" },
  { id: "m12", name: "배수아", phone: "010-1234-5612", time: "18:00", cls: "부트캠프" },
  { id: "m13", name: "권도현", phone: "010-1234-5613", time: "18:00", cls: "부트캠프" },
  { id: "m14", name: "홍은채", phone: "010-1234-5614", time: "19:30", cls: "리커버리" },
];

const SHOT_COUNT = 8;   // 버스트로 찍는 총 컷 수
const PICK_COUNT = 4;   // 그중 최종 선택할 컷 수
const BEHIND_INTERVAL_MS = 350; // 비하인드 영상용 프레임 캡처 간격

const state = {
  selected: [],      // { id, name, phone, cls, time, manual? }
  stream: null,
  shots: [],         // 8컷 원본 캡처 (dataURL)
  pickedIdx: [],      // 선택된 인덱스 (최대 4개)
  finalShots: [],     // 최종 선택된 4컷
  behindFrames: [],   // 촬영 세션 내내 몰래 찍은 저해상도 프레임들 (비하인드 영상 원본)
  behindTimer: null,
};

/* ===================== 화면 전환 ===================== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ===================== Screen 1: 이름 선택 (다중 선택 + 5열 칩) ===================== */
function isSelected(id) {
  return state.selected.some(m => m.id === id);
}

function toggleMember(member) {
  const idx = state.selected.findIndex(m => m.id === member.id);
  if (idx >= 0) {
    state.selected.splice(idx, 1);
  } else {
    state.selected.push(member);
  }
  renderMemberList(document.getElementById('search-input').value.trim());
  renderSelectedBar();
}

function renderMemberList(filter = "") {
  const list = document.getElementById('slot-list');
  list.innerHTML = "";
  const groups = {};
  MOCK_MEMBERS
    .filter(m => m.name.includes(filter))
    .forEach(m => {
      if (!groups[m.time]) groups[m.time] = [];
      groups[m.time].push(m);
    });

  Object.keys(groups).sort().forEach(time => {
    const label = document.createElement('div');
    label.className = 'slot-group-label';
    label.textContent = time;
    list.appendChild(label);

    const grid = document.createElement('div');
    grid.className = 'chip-grid';

    groups[time].forEach(m => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (isSelected(m.id) ? ' selected' : '');
      chip.innerHTML = `<div class="chip-name">${m.name}</div>`;
      chip.addEventListener('click', () => toggleMember(m));
      grid.appendChild(chip);
    });

    list.appendChild(grid);
  });
}

document.getElementById('search-input').addEventListener('input', (e) => {
  renderMemberList(e.target.value.trim());
});

document.getElementById('today-label').textContent =
  new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' }) + ' · 여러 명이면 다 같이 선택해주세요';

renderMemberList();

/* ===================== 번호 직접 입력 ===================== */
let manualCounter = 0;
document.getElementById('btn-manual-toggle').addEventListener('click', () => {
  document.getElementById('manual-form').classList.toggle('open');
});

document.getElementById('btn-manual-add').addEventListener('click', () => {
  const nameInput = document.getElementById('manual-name');
  const phoneInput = document.getElementById('manual-phone');
  const phone = phoneInput.value.trim();
  let name = nameInput.value.trim();

  if (!phone) {
    showError("전화번호를 입력해주세요.");
    return;
  }
  if (!/^0\d{1,2}-?\d{3,4}-?\d{4}$/.test(phone)) {
    showError("전화번호 형식을 확인해주세요. (예: 010-1234-5678)");
    return;
  }
  if (!name) {
    // 이름 없으면 전화번호 뒷자리로 대체 표시 (예: 010-1234-5678 -> 5678님)
    const digits = phone.replace(/-/g, "");
    name = digits.slice(-4);
  }

  manualCounter++;
  const member = {
    id: "manual-" + manualCounter,
    name, phone,
    cls: "직접 입력",
    time: "-",
    manual: true,
    displayOnly: !nameInput.value.trim() // 이름 직접 안 넣었으면 표시용 라벨임을 표시
  };
  state.selected.push(member);
  nameInput.value = "";
  phoneInput.value = "";
  document.getElementById('manual-form').classList.remove('open');
  hideError();
  renderSelectedBar();
});

/* ===================== 선택된 인원 요약 바 ===================== */
function renderSelectedBar() {
  const bar = document.getElementById('selected-bar');
  const btn = document.getElementById('btn-to-camera');

  if (state.selected.length === 0) {
    bar.classList.remove('show');
    bar.innerHTML = "";
    btn.disabled = true;
    btn.textContent = "촬영 시작";
    return;
  }

  bar.classList.add('show');
  bar.innerHTML = "";
  state.selected.forEach(m => {
    const pill = document.createElement('div');
    pill.className = 'selected-pill';
    const label = m.displayOnly ? `010-****-${m.name}` : m.name;
    pill.innerHTML = `<span>${label}${m.manual ? ' (직접입력)' : ''}</span>`;
    const removeBtn = document.createElement('button');
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', () => {
      state.selected = state.selected.filter(x => x.id !== m.id);
      renderMemberList(document.getElementById('search-input').value.trim());
      renderSelectedBar();
    });
    pill.appendChild(removeBtn);
    bar.appendChild(pill);
  });

  btn.disabled = false;
  btn.textContent = `촬영 시작 (${state.selected.length}명)`;
}

document.getElementById('btn-to-camera').addEventListener('click', startCameraFlow);

/* ===================== Screen 2: 카메라 ===================== */
function selectedNamesLabel() {
  const names = state.selected.map(m => m.name);
  if (names.length <= 2) return names.join(", ");
  return `${names[0]}, ${names[1]} 외 ${names.length - 2}명`;
}

async function startCameraFlow() {
  showScreen('screen-camera');
  document.getElementById('cam-name').textContent = selectedNamesLabel();
  state.shots = [];
  renderShotDots();

  const video = document.getElementById('video');
  try {
    const constraints = {
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    };
    state.stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = state.stream;
    video.style.transform = "none";
  } catch (err) {
    try {
      state.stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      video.srcObject = state.stream;
    } catch (err2) {
      showError("카메라를 불러올 수 없어요. 권한을 확인해주세요.\n(" + err2.message + ")");
      return;
    }
  }

  document.getElementById('cam-hint').textContent = "화면을 터치하면 촬영이 시작돼요 (4컷)";
  document.getElementById('screen-camera').onclick = beginCaptureSequence;
}

function renderShotDots() {
  const wrap = document.getElementById('shot-dots');
  wrap.innerHTML = "";
  for (let i = 0; i < SHOT_COUNT; i++) {
    const dot = document.createElement('div');
    dot.className = 'shot-dot' + (i < state.shots.length ? ' done' : '');
    wrap.appendChild(dot);
  }
}

let capturing = false;
async function beginCaptureSequence() {
  if (capturing) return;
  capturing = true;
  document.getElementById('screen-camera').onclick = null;

  // 첫 컷: 정식 카운트다운
  document.getElementById('cam-hint').textContent = "표정 준비하세요!";
  await countdownFrom(3);
  startBehindCapture(); // 여기서부터 세션 끝까지 몰래 저프레임 계속 캡처 (비하인드 영상용)
  await captureShot();
  document.getElementById('cam-hint').textContent = `1/${SHOT_COUNT}컷 · 계속 갈게요!`;

  // 나머지 컷: 버스트로 빠르게 (카운트다운 없이 짧은 텀으로 연속 촬영)
  for (let i = 1; i < SHOT_COUNT; i++) {
    await sleep(850);
    await captureShot();
    document.getElementById('cam-hint').textContent =
      (i < SHOT_COUNT - 1) ? `${i + 1}/${SHOT_COUNT}컷 · 계속 포즈!` : "촬영 완료!";
  }

  await sleep(400);
  stopBehindCapture();
  stopStream();
  showPickScreen();
  capturing = false;
}

/* ---- 비하인드(제작과정) 프레임 캡처: 화면에 티 안 나게 백그라운드로 저해상도 캡처 ---- */
function startBehindCapture() {
  state.behindFrames = [];
  const video = document.getElementById('video');
  state.behindTimer = setInterval(() => {
    const c = document.createElement('canvas');
    c.width = 320; c.height = 240; // 비하인드 영상은 화질보다 용량/속도 우선이라 저해상도로
    const ctx = c.getContext('2d');
    if (video.style.transform.includes('scaleX(-1)')) {
      ctx.translate(c.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, 0, 0, c.width, c.height);
    state.behindFrames.push(c.toDataURL('image/jpeg', 0.6));
  }, BEHIND_INTERVAL_MS);
}
function stopBehindCapture() {
  clearInterval(state.behindTimer);
  state.behindTimer = null;
  // ===== 실제 연동 시 =====
  // state.behindFrames (수십~백여 장의 저해상도 이미지) 를 Oracle VM으로 전송하면,
  // 서버에서 ffmpeg로 "-r 8" 같은 저프레임 설정으로 이어붙여 짧은 mp4로 인코딩.
  // 인코딩된 mp4는 Supabase Storage에 올리고, 문자에는 그 링크만 보냄.
  console.log(`비하인드 프레임 ${state.behindFrames.length}장 캡처됨 (서버 mp4 인코딩 대상)`);
}

function countdownFrom(n) {
  return new Promise(resolve => {
    const el = document.getElementById('countdown');
    el.style.display = 'block';
    let cur = n;
    el.textContent = cur;
    const tick = setInterval(() => {
      cur -= 1;
      if (cur === 0) {
        clearInterval(tick);
        el.style.display = 'none';
        resolve();
      } else {
        el.textContent = cur;
      }
    }, 700);
  });
}

async function captureShot() {
  const video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  canvas.width = 640;
  canvas.height = 480;
  const ctx = canvas.getContext('2d');
  ctx.save();
  if (video.style.transform.includes('scaleX(-1)')) {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.restore();
  state.shots.push(canvas.toDataURL('image/jpeg', 0.92));

  const flash = document.getElementById('flash');
  flash.classList.remove('on');
  void flash.offsetWidth;
  flash.classList.add('on');

  renderShotDots();
}

function stopStream() {
  if (state.stream) {
    state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ===================== Screen 2.5: 8컷 중 4컷 선택 ===================== */
function showPickScreen() {
  state.pickedIdx = [];
  renderPickGrid();
  showScreen('screen-pick');
}

function renderPickGrid() {
  const grid = document.getElementById('pick-grid');
  grid.innerHTML = "";
  state.shots.forEach((src, i) => {
    const thumb = document.createElement('div');
    const order = state.pickedIdx.indexOf(i);
    thumb.className = 'pick-thumb' + (order >= 0 ? ' selected' : '');
    thumb.innerHTML = `<img src="${src}"><div class="pick-badge">${order >= 0 ? order + 1 : i + 1}</div>`;
    thumb.addEventListener('click', () => togglePick(i));
    grid.appendChild(thumb);
  });

  const btn = document.getElementById('btn-pick-confirm');
  const remaining = PICK_COUNT - state.pickedIdx.length;
  btn.disabled = remaining !== 0;
  btn.textContent = remaining > 0 ? `${remaining}장 더 골라주세요` : "다음";
}

function togglePick(i) {
  const idx = state.pickedIdx.indexOf(i);
  if (idx >= 0) {
    state.pickedIdx.splice(idx, 1);
  } else {
    if (state.pickedIdx.length >= PICK_COUNT) {
      showError(`최대 ${PICK_COUNT}장까지만 고를 수 있어요. 다른 컷을 먼저 취소해주세요.`);
      return;
    }
    state.pickedIdx.push(i);
  }
  renderPickGrid();
}

document.getElementById('btn-pick-confirm').addEventListener('click', () => {
  state.finalShots = state.pickedIdx.map(i => state.shots[i]);
  buildComposite();
  showScreen('screen-review');
});

/* ===================== Screen 3: 합성 ===================== */
function buildComposite() {
  const canvas = document.getElementById('composite-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);

  const pad = 20;
  const gap = 12;
  const cellW = (W - pad * 2 - gap) / 2;
  const cellH = cellW * 0.75;
  const positions = [
    [pad, pad],
    [pad + cellW + gap, pad],
    [pad, pad + cellH + gap],
    [pad + cellW + gap, pad + cellH + gap],
  ];

  let loaded = 0;
  const imgs = state.finalShots.map(src => {
    const img = new Image();
    img.src = src;
    return img;
  });

  const drawAll = () => {
    imgs.forEach((img, i) => {
      const [x, y] = positions[i];
      ctx.save();
      roundRectClip(ctx, x, y, cellW, cellH, 8);
      ctx.drawImage(img, x, y, cellW, cellH);
      ctx.restore();
    });
    drawOverlay(ctx, W, H, pad, cellH * 2 + gap + pad);
  };

  imgs.forEach(img => {
    img.onload = () => {
      loaded++;
      if (loaded === imgs.length) drawAll();
    };
  });
}

function roundRectClip(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.clip();
}

function drawOverlay(ctx, W, H, pad, gridBottomY) {
  const footerTop = gridBottomY + 8;
  const footerH = H - footerTop - pad * 0.4;

  const markR = footerH * 0.42;
  const markCx = pad + markR;
  const markCy = footerTop + footerH / 2;
  ctx.fillStyle = "#14163b";
  ctx.beginPath();
  ctx.arc(markCx, markCy, markR, 0, Math.PI * 2);
  ctx.fill();
  ctx.font = `${markR * 1.1}px sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("🔥", markCx, markCy + 2);

  const textX = markCx + markR + 16;
  ctx.textAlign = "left";
  ctx.fillStyle = "#14163b";
  ctx.font = "700 26px 'Barlow Condensed', sans-serif";
  ctx.fillText("F45 SEONGSU", textX, footerTop + footerH * 0.42);

  const todayStr = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
  const clsLabel = state.selected.length ? state.selected[0].cls : "";
  ctx.fillStyle = "#6b6d78";
  ctx.font = "500 16px 'Inter', sans-serif";
  ctx.fillText(todayStr + "  ·  " + clsLabel, textX, footerTop + footerH * 0.72);

  ctx.fillStyle = "#d5352a";
  ctx.fillRect(0, H - 6, W, 6);
}

document.getElementById('btn-retake').addEventListener('click', startCameraFlow);

document.getElementById('btn-confirm').addEventListener('click', async () => {
  showScreen('screen-done');
  document.getElementById('sending-spinner').style.display = 'block';
  document.getElementById('done-icon').style.display = 'none';
  document.getElementById('done-title').textContent = "전송하고 있어요";
  document.getElementById('done-sub').textContent = `${state.selected.length}명에게 순서대로 문자를 보내는 중이에요`;

  // ===== 실제 연동 시 여기서 =====
  // 1) canvas.toDataURL() → Supabase Storage 업로드 (1회)
  // 2) 업로드된 URL을 state.selected 각 phone 번호로 Oracle VM 릴레이 전달
  // 3) Oracle VM이 Aligo API로 각 인원에게 "링크 담긴 문자" 개별 발송
  await sleep(1800);

  document.getElementById('sending-spinner').style.display = 'none';
  document.getElementById('done-icon').style.display = 'flex';
  document.getElementById('done-title').textContent = "전송 완료!";
  const names = state.selected.map(m => m.name).join(", ");
  document.getElementById('done-sub').innerHTML =
    `<span class="done-phone">${names}</span>님 폰으로<br>사진과 촬영과정 영상 링크를 보냈어요`;

  await sleep(3500);
  resetToStart();
});

function resetToStart() {
  state.selected = [];
  state.shots = [];
  state.pickedIdx = [];
  state.finalShots = [];
  state.behindFrames = [];
  document.getElementById('search-input').value = "";
  document.getElementById('manual-form').classList.remove('open');
  renderMemberList();
  renderSelectedBar();
  showScreen('screen-name');
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.style.display = 'block';
  box.textContent = msg;
  clearTimeout(window.__errTimer);
  window.__errTimer = setTimeout(hideError, 3500);
}
function hideError() {
  document.getElementById('error-box').style.display = 'none';
}
</script>
