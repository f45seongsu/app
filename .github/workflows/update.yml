name: F45 데이터 자동 갱신

on:
  schedule:
    - cron: '0 */2 * * *'   # 2시간마다 한 번, 단발성 실행 (웹훅이 실시간을 커버하니 이건 안전망용)
  workflow_dispatch:         # 수동 실행 버튼

jobs:
  update-bookings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 라이브러리 설치
        run: pip install requests supabase

      - name: 자동갱신 실행 (단발성, 반복루프 없음)
        env:
          GLOFOX_API_KEY: ${{ secrets.GLOFOX_API_KEY }}
          GLOFOX_API_TOKEN: ${{ secrets.GLOFOX_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python 자동갱신.py
