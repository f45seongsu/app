name: F45 회원정보 갱신

on:
  schedule:
    # 한국시간(KST) 06:00 / 11:00 / 17:00 / 22:00 하루 4회
    # (KST = UTC+9 이므로 UTC 21:00 / 02:00 / 08:00 / 13:00)
    - cron: '0 21,2,8,13 * * *'
  workflow_dispatch:   # 수동 실행 버튼

jobs:
  update-members:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 라이브러리 설치
        run: pip install requests supabase

      - name: 전체회원갱신 실행
        env:
          GLOFOX_API_KEY: ${{ secrets.GLOFOX_API_KEY }}
          GLOFOX_API_TOKEN: ${{ secrets.GLOFOX_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python 전체회원갱신.py
