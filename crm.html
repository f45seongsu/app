<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F45 성수 · 세일즈 CRM</title>
<style>
:root{
  --bg:#0a1220; --card:#111d33; --line:#22314a; --txt:#e8edf5; --dim:#8a97ac;
  --red:#d6001c; --grn:#3a7a4a; --org:#e0954f; --blu:#5aa0e0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}
.topbar{position:sticky;top:0;z-index:20;background:#0e1830;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:16px;margin:0;font-weight:800;white-space:nowrap}
.topbar input{background:#0a1220;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px;flex:1;min-width:160px;max-width:320px}
.staffbtn{background:#0a1220;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.staffbtn.active{border-color:var(--red);color:var(--red)}
.mini{background:#0a1220;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer}
.mini:hover{border-color:var(--blu)}
.banner{background:#1c2f4d;border-bottom:1px solid var(--line);padding:8px 20px;font-size:12px;display:none;align-items:center;gap:10px}
.wrap{max-width:1400px;margin:0 auto;padding:16px 20px 60px}
.section{margin-bottom:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0d1626}
.sechead{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none}
.sechead .icon{font-size:18px}
.sechead .title{font-weight:800;font-size:14px;flex:1}
.sechead .count{background:var(--red);color:#fff;border-radius:20px;padding:1px 9px;font-size:11px;font-weight:700}
.sechead .arrow{color:var(--dim);font-size:12px}
.secbody{padding:0 12px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.secbody.closed{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.cname{font-weight:700;font-size:13.5px}
.cmeta{font-size:11px;color:var(--dim);margin-top:2px}
.cphone{font-size:11px;color:var(--blu)}
.rowbtns{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.rowbtns button{font-size:10px;padding:2px 7px}
.memoin{width:100%;background:#0a1220;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 7px;font-size:11px;margin-top:6px}
.acts{display:flex;gap:6px;margin-top:6px}
.acts button{flex:1;font-size:11px;padding:5px}
.outcome{width:100%;background:#0a1220;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px;font-size:11px;margin-top:6px}
.aibox{margin-top:6px;background:#0a1220;border:1px solid var(--line);border-radius:8px;padding:6px}
.aibox textarea{width:100%;min-height:55px;background:transparent;border:none;color:var(--txt);font-size:11px;resize:vertical;font-family:inherit}
.empty{padding:14px;color:var(--dim);font-size:12px;grid-column:1/-1}
.stat{font-size:11px;color:var(--dim);padding:0 16px 10px}
select.memoin{padding:5px 7px}
</style>
</head>
<body>

<div class="topbar">
  <h1>🎯 F45 성수 세일즈 CRM</h1>
  <input id="search" placeholder="🔍 이름/전화번호 검색" oninput="renderAll()">
  <button class="staffbtn" id="staffBtn" onclick="pickStaff()">🙋 매니저 선택</button>
  <button class="mini" onclick="loadData()">↻ 새로고침</button>
  <a href="f45app.html" style="color:var(--dim);font-size:12px;margin-left:auto">← 출결 앱으로</a>
</div>
<div class="banner" id="banner"></div>

<div class="wrap" id="app">
  <div class="empty">불러오는 중…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== 설정 =====
const SUPABASE_URL = "https://mvgbwsbvngdnxdndwimb.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZRHS4-UR7Q07Fmtc_P-19g_fVlIc85X";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const today = new Date().toISOString().slice(0,10);
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function daysBetween(a,b){return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000);}
function ddaysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10);}

let MEMBERS = {};
let STAFF_LIST = [];
let ACTIVE_STAFF = localStorage.getItem('crm_active_staff') || '';
let SECTIONS_OPEN = JSON.parse(localStorage.getItem('crm_sections_open')||'{}');

function payMember(m){
 const t=m.membership||'';
 if(t.includes('무료혜택')||t.includes('Complimentary'))return false;
 if(t.includes('횟수권')||t.includes('Class Pass')){
  const total=m.pass_total||0; const remain=(m.pass_remaining!=null)?m.pass_remaining:total;
  return total>=10 && remain>0;
 }
 return true;
}

async function loadStaffList(){
 try{
  const{data}=await sb.from('staff_list').select('name').eq('active',true).order('created_at');
  STAFF_LIST=(data||[]).map(s=>s.name);
 }catch(e){}
 updateStaffBtn();
}
function updateStaffBtn(){
 const b=document.getElementById('staffBtn');
 if(ACTIVE_STAFF){b.textContent='🙋 '+ACTIVE_STAFF;b.classList.add('active');}
 else{b.textContent='🙋 매니저 선택';b.classList.remove('active');}
}
async function pickStaff(){
 let list=STAFF_LIST.slice();
 if(!list.length){await loadStaffList();list=STAFF_LIST.slice();}
 const opts=list.map((n,i)=>`${i+1}. ${n}`).join('\n');
 const idx=prompt('매니저 선택 (번호 입력)\n'+opts+'\n\n0. 새 이름 추가');
 if(idx==null)return;
 const n=parseInt(idx,10);
 if(n===0){
  const nm=prompt('추가할 이름을 입력하세요');
  if(!nm)return;
  await sb.from('staff_list').insert({name:nm.trim(),active:true});
  await loadStaffList();
  alert(nm.trim()+' 추가됐어요. 다시 눌러서 선택하세요.');
  return;
 }
 if(n>=1 && n<=list.length){
  ACTIVE_STAFF=list[n-1];
  localStorage.setItem('crm_active_staff',ACTIVE_STAFF);
  updateStaffBtn();
 }
}

function managerRow(uid,ctx){
 if(!STAFF_LIST.length)return '';
 const btns=STAFF_LIST.map(n=>`<button class="mini" style="opacity:${n===ACTIVE_STAFF?1:.6};${n===ACTIVE_STAFF?'border-color:var(--red);color:var(--red)':''}" onclick="event.stopPropagation();quickSetStaff('${n}')">${n}</button>`).join('');
 return `<div class="rowbtns">${btns}</div>`;
}
function quickSetStaff(n){
 ACTIVE_STAFF=n;
 localStorage.setItem('crm_active_staff',ACTIVE_STAFF);
 updateStaffBtn();
 renderAll();
}
function channelRow(uid){
 const chans=['통화','대면','문자','카톡','DM'];
 const btns=chans.map(c=>`<button class="mini" onclick="event.stopPropagation();logChannel('${uid}','${c}')">${c}</button>`).join('');
 return `<div class="rowbtns">${btns}</div>`;
}
async function logChannel(uid,channel){
 const author=ACTIVE_STAFF||'미지정';
 try{ await sb.from('memo_log').insert({glofox_user_id:uid,coach_name:author,content:'['+channel+'] 접촉'}); }catch(e){}
 const m=MEMBERS[uid]; if(m){ m.crm_outcome='접촉함'; await sb.from('people').update({crm_outcome:'접촉함'}).eq('glofox_user_id',uid); }
 renderAll();
}
async function saveMemo(uid,val){
 if(!val||!val.trim())return;
 const author=ACTIVE_STAFF||'미지정';
 try{ await sb.from('memo_log').insert({glofox_user_id:uid,coach_name:author,content:val}); }catch(e){}
}
async function setOutcome(uid,val){
 const m=MEMBERS[uid]; if(m)m.crm_outcome=val;
 try{ await sb.from('people').update({crm_outcome:val}).eq('glofox_user_id',uid); }catch(e){}
}
function sendSms(uid){
 const m=MEMBERS[uid]||{};
 const ph=(m.phone||'').replace(/[^0-9]/g,'');
 if(!ph){alert('전화번호가 없어요.');return;}
 location.href='sms:'+ph;
}
async function aiMsg(uid,situation,detail,btn){
 if(btn){btn.disabled=true;btn.textContent='생성중...';}
 const m=MEMBERS[uid]||{};
 try{
  const{data,error}=await sb.functions.invoke('glofox-ai',{body:{type:'message',name:m.name||'회원',situation,detail}});
  if(btn){btn.disabled=false;btn.textContent='🤖AI문구';}
  if(error||!data?.text){alert('생성 실패: '+(error?.message||'응답 없음'));return;}
  navigator.clipboard.writeText(data.text);
  showAiBox(uid,data.text,btn);
 }catch(e){if(btn){btn.disabled=false;btn.textContent='🤖AI문구';}alert('오류: '+e.message);}
}
function showAiBox(uid,text,btn){
 const boxId='aibox_'+uid;
 let box=document.getElementById(boxId);
 if(!box){
  box=document.createElement('div');
  box.id=boxId; box.className='aibox';
  btn.closest('.acts').insertAdjacentElement('afterend', box);
 }
 box.innerHTML=`<textarea id="${boxId}_ta" onclick="event.stopPropagation()">${esc(text)}</textarea>
  <div style="display:flex;gap:6px;margin-top:4px;align-items:center">
   <span class="mini" style="flex:1;border:none;background:none;padding:0;color:var(--dim)">✅ 복사됨 · 수정후 재복사 가능</span>
   <button class="mini" onclick="event.stopPropagation();copyAiBox('${boxId}',this)">복사</button>
   <button class="mini" style="opacity:.6" onclick="event.stopPropagation();document.getElementById('${boxId}').remove()">닫기</button>
  </div>`;
}
function copyAiBox(boxId,btn){
 const ta=document.getElementById(boxId+'_ta');
 if(!ta)return;
 navigator.clipboard.writeText(ta.value);
 if(btn){const old=btn.textContent;btn.textContent='복사됨!';setTimeout(()=>btn.textContent=old,1200);}
}

// ===== 데이터 로드 & 분류 =====
async function loadData(){
 document.getElementById('app').innerHTML='<div class="empty">불러오는 중…</div>';
 await loadStaffList();

 let people=[],frm=0;
 while(true){
  const{data,error}=await sb.from('people').select(
   'glofox_user_id,name,phone,stage,membership,join_date,end_date,pass_remaining,pass_total,crm_outcome'
  ).range(frm,frm+999);
  if(error){document.getElementById('app').innerHTML='<div class="empty">오류: '+esc(error.message)+'</div>';return;}
  people=people.concat(data||[]);
  if((data||[]).length<1000)break; frm+=1000;
 }
 MEMBERS={}; people.forEach(p=>{if(p.glofox_user_id)MEMBERS[p.glofox_user_id]=p;});

 // 최근 60일 출석 데이터 (마지막 방문일/페이스 계산용)
 const since=ddaysAgo(60);
 let att=[],frm2=0;
 while(true){
  const{data}=await sb.from('attendance').select('glofox_user_id,class_time').eq('attended',true).gte('class_time',since).range(frm2,frm2+999);
  att=att.concat(data||[]);
  if((data||[]).length<1000)break; frm2+=1000;
 }
 const lastVisit={};
 att.forEach(a=>{const uid=a.glofox_user_id;const d=String(a.class_time).slice(0,10);if(!lastVisit[uid]||d>lastVisit[uid])lastVisit[uid]=d;});
 Object.values(MEMBERS).forEach(m=>{m._lastVisit=lastVisit[m.glofox_user_id]||null;});

 renderAll();
}

function classify(m){
 if(!m.glofox_user_id||!m.name)return null;
 if(m.stage==='리드')return 'lead';
 if(m.stage==='트라이얼')return 'trial';
 if(m.stage==='과거회원')return 'churn';
 if(m.stage==='회원'){
  const ed=m.end_date?m.end_date.slice(0,10):null;
  if(ed && ed<today) return 'churn';
  if(!payMember(m)) return null; // 무료혜택/소액횟수권 등은 관리 대상서 제외
  if(ed && daysBetween(ed,today)<=14) return 'expiring';
  const jd=m.join_date?m.join_date.slice(0,10):null;
  if(jd && daysBetween(today,jd)<=30) return 'new';
  if(m._lastVisit){
   const gap=daysBetween(today,m._lastVisit);
   if(gap>=14) return 'dropping';
  }
 }
 return null;
}

function keyMetric(m,bucket){
 switch(bucket){
  case 'lead': return '가입 '+(m.join_date||'').slice(0,10);
  case 'trial': return '가입 '+(m.join_date||'').slice(0,10)+(m._lastVisit?(' · 최근방문 '+m._lastVisit):' · 방문없음');
  case 'new': return '가입 '+(m.join_date||'').slice(0,10)+' · '+(m.membership||'');
  case 'expiring': {
   const ed=(m.end_date||'').slice(0,10);
   const d=daysBetween(ed,today);
   return '만료 '+ed+' (D-'+d+')';
  }
  case 'dropping': {
   const gap=daysBetween(today,m._lastVisit);
   return '최근방문 '+m._lastVisit+' ('+gap+'일 전)';
  }
  case 'churn': {
   if(m.end_date) return '만료됨 '+m.end_date.slice(0,10);
   return m._lastVisit?('마지막방문 '+m._lastVisit):'방문기록없음';
  }
 }
 return '';
}
function situationFor(bucket){
 return {lead:'F45 성수 앱에 가입했으나 아직 방문 안함. 첫 방문 유도',
  trial:'체험 중이거나 체험 후 미등록',
  new:'최근 신규 등록한 회원, 초기 정착 케어',
  expiring:'멤버십 만료 임박, 재등록 유도',
  dropping:'최근 출석이 뜸해짐, 복귀 유도',
  churn:'만료/이탈 회원, 윈백(재유치) 시도'}[bucket]||'';
}

const SECTION_DEFS=[
 {key:'lead',icon:'🎯',title:'리드'},
 {key:'trial',icon:'⚡',title:'트라이얼'},
 {key:'new',icon:'🆕',title:'신규 정착 케어(30일 이내)'},
 {key:'expiring',icon:'⏳',title:'만료 임박(D-14 이내)'},
 {key:'dropping',icon:'📉',title:'출석 저하(2주+ 미출석)'},
 {key:'churn',icon:'🚨',title:'이탈/휴면'},
];

function renderAll(){
 const q=(document.getElementById('search').value||'').trim();
 const qDigits=q.replace(/\D/g,'');
 const buckets={lead:[],trial:[],new:[],expiring:[],dropping:[],churn:[]};
 Object.values(MEMBERS).forEach(m=>{
  const b=classify(m);
  if(!b)return;
  if(q){
   const nameMatch=m.name&&m.name.includes(q);
   const phMatch=qDigits.length>=3&&(m.phone||'').replace(/\D/g,'').includes(qDigits);
   if(!nameMatch&&!phMatch)return;
  }
  buckets[b].push(m);
 });
 // 정렬: 긴급도 순
 buckets.expiring.sort((a,b)=>(a.end_date||'').localeCompare(b.end_date||''));
 buckets.dropping.sort((a,b)=>(a._lastVisit||'').localeCompare(b._lastVisit||''));
 buckets.lead.sort((a,b)=>(b.join_date||'').localeCompare(a.join_date||''));
 buckets.trial.sort((a,b)=>(b.join_date||'').localeCompare(a.join_date||''));

 const totalActionable=buckets.lead.length+buckets.trial.length+buckets.expiring.length+buckets.dropping.length;

 let html=`<div class="stat">오늘 챙길 사람: <b style="color:var(--red)">${totalActionable}명</b> (리드+트라이얼+만료임박+출석저하 기준)</div>`;

 SECTION_DEFS.forEach(sec=>{
  const list=buckets[sec.key];
  const isOpen = SECTIONS_OPEN[sec.key] !== false; // 기본 열림
  html+=`<div class="section">
   <div class="sechead" onclick="toggleSection('${sec.key}')">
    <span class="icon">${sec.icon}</span><span class="title">${sec.title}</span>
    <span class="count">${list.length}</span>
    <span class="arrow">${isOpen?'▲':'▼'}</span>
   </div>
   <div class="secbody ${isOpen?'':'closed'}" id="secbody_${sec.key}">
    ${list.length? list.map(m=>cardHtml(m,sec.key)).join('') : '<div class="empty">해당 없음 👍</div>'}
   </div>
  </div>`;
 });

 document.getElementById('app').innerHTML=html;
}
function toggleSection(key){
 SECTIONS_OPEN[key] = !(SECTIONS_OPEN[key] !== false);
 localStorage.setItem('crm_sections_open', JSON.stringify(SECTIONS_OPEN));
 renderAll();
}

function cardHtml(m,bucket){
 const uid=m.glofox_user_id;
 const metric=keyMetric(m,bucket);
 const outcome=m.crm_outcome||'미접촉';
 const detail=metric;
 const situation=situationFor(bucket);
 return `<div class="card">
  <div class="cardhead">
   <div>
    <div class="cname">${esc(m.name)}</div>
    <div class="cphone">${esc(m.phone||'번호없음')}</div>
    <div class="cmeta">${esc(metric)}</div>
   </div>
  </div>
  ${managerRow(uid)}
  ${channelRow(uid)}
  <input class="memoin" placeholder="메모 남기기" onchange="saveMemo('${uid}',this.value)">
  <div class="acts">
   <button class="mini" onclick="aiMsg('${uid}','${situation.replace(/'/g,"\\'")}','${detail.replace(/'/g,"\\'")}',this)">🤖AI문구</button>
   <button class="mini" onclick="sendSms('${uid}')">📱문자보내기</button>
  </div>
  <select class="outcome" onchange="setOutcome('${uid}',this.value)">
   ${['미접촉','접촉함','재등록함','보류','이탈확정'].map(o=>`<option value="${o}" ${o===outcome?'selected':''}>${o}</option>`).join('')}
  </select>
 </div>`;
}

loadData();
</script>
</body>
</html>
