<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F45 성수 · 회원 문자 시스템</title>
<style>
:root{--navy:#0a1628;--red:#e4002b;--card:#12203a;--line:#22344f;--txt:#e8eef7;--dim:#8fa3bd;--grn:#25c26e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--txt);font-family:'Pretendard',-apple-system,sans-serif;padding:16px 14px 60px;max-width:1150px;margin:0 auto}
h1{font-size:19px;font-weight:800;margin-bottom:2px}
.sub{color:var(--dim);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.wklab{color:var(--dim);font-size:12px;margin-bottom:6px}
textarea{width:100%;background:#0e1a30;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;min-height:180px;resize:vertical}
input[type=text],input[type=search]{width:100%;background:#0e1a30;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 11px;font-size:13px}
select{background:#0e1a30;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 11px;font-size:13px}
.btn{background:var(--red);color:#fff;border:none;border-radius:9px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;margin-top:10px}
.btn.sec{background:#1c2f4d;border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:11px;margin:0}
.listhead{color:var(--dim);font-size:12px;margin:16px 0 8px;line-height:1.6}
.listhead b{color:var(--txt)}
.center{text-align:center;color:var(--dim);padding:30px}

.tabnav{display:flex;gap:6px;margin-bottom:14px}
.tabbtn{flex:1;background:#0e1a30;border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:11px 6px;font-size:12px;font-weight:700;cursor:pointer}
.tabbtn.on{background:var(--red);border-color:var(--red);color:#fff}
.tabpane{display:none}
.tabpane.on{display:block}

.filterrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filterrow input[type=text]{flex:1;min-width:160px}

.amb-row{display:flex;align-items:center;gap:10px;background:#0e1a30;border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:6px;flex-wrap:wrap}
.amb-row .who{flex:1;min-width:180px;font-size:13px}
.amb-row .who b{color:var(--txt)}
.amb-row .who span{color:var(--dim);font-size:11px;display:block;margin-top:2px}
.amb-btn{border:1px solid var(--line);background:#1c2f4d;color:var(--txt);border-radius:7px;padding:5px 10px;font-size:11px;cursor:pointer}
.amb-btn.on{background:var(--red);border-color:var(--red);color:#fff}

.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto;overflow-y:hidden}
.trow{display:flex;align-items:center;gap:9px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px;min-width:940px}
.trow:last-child{border-bottom:none}
.trow:hover{background:#0e1a30}
.trow.header{color:var(--dim);font-size:10px;letter-spacing:.03em;text-transform:uppercase;background:#0a1220}
.c-chk{flex:0 0 20px}
.c-photo{flex:0 0 24px;height:24px}
.c-photo .ph{width:24px;height:24px;border-radius:50%;background:#20304d;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--dim);overflow:hidden}
.c-photo .ph img{width:100%;height:100%;object-fit:cover}
.c-name{flex:0 0 76px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-phone{flex:0 0 104px;color:var(--dim);white-space:nowrap}
.c-plan{flex:0 0 148px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.c-exp{flex:0 0 60px;white-space:nowrap;font-size:11px}
.c-att{flex:1;display:flex;align-items:center;gap:7px}
.c-pass{flex:0 0 96px;white-space:nowrap;font-size:11px}
.c-pace{flex:1;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-actions{flex:0 0 130px;display:flex;gap:4px;justify-content:flex-end}
.c-actions button{flex:1;padding:4px 5px;font-size:10px;margin:0;white-space:nowrap}

.toolbar{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
.toolbar label{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:5px}
.count-pill{background:#1c2f4d;border-radius:20px;padding:3px 12px;font-size:12px;color:var(--dim)}
.count-pill b{color:var(--txt)}

.opt-row{display:flex;align-items:center;gap:8px}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#1c2f4d;border:1px solid var(--line);border-radius:22px;transition:.2s}
.slider:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:var(--dim);border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--red);border-color:var(--red)}
.switch input:checked + .slider:before{transform:translateX(16px);background:#fff}
.opt-label{font-size:12px;color:var(--txt)}
.opt-sub{font-size:11px;color:var(--dim);margin-left:4px}

.excl-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:220px;overflow-y:auto}
.excl-chip{display:inline-flex;align-items:center;gap:6px;background:#0e1a30;border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;margin:3px;font-size:12px}
.excl-chip button{background:var(--red);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;line-height:1}

#detailModal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:100}
#detailModal.show{display:flex}
#detailSheet{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:80vh;overflow:auto;padding:20px}
@media(min-width:700px){#detailModal{align-items:center}#detailSheet{border-radius:16px}}
.d-close{float:right;color:var(--dim);cursor:pointer;font-size:22px;line-height:1}
.d-row{display:flex;gap:10px;margin:8px 0;font-size:14px}
.d-k{color:var(--dim);min-width:80px;flex:none}
.d-name{font-size:18px;font-weight:800;margin-bottom:10px}

.wkgrp{display:flex;gap:2px;flex:none}
.dsq{width:9px;height:9px;border-radius:2px;background:#1a2942;flex:none}
.dsq.on{background:var(--grn)}
.dsq.fut{opacity:.25}
</style></head><body>

<h1>📱 F45 성수 · 회원 문자 시스템</h1>
<div class="sub">활성 회원을 한눈에 보고, 정렬하고, 선택해서 문자 보내세요.</div>

<div class="card">
  <div class="opt-row">
    <label class="switch"><input type="checkbox" id="inclPass" onchange="onToggleChange()"><span class="slider"></span></label>
    <span class="opt-label">횟수권(클래스팩) 회원도 [전체 회원/단체문자] 탭에 포함</span>
    <span class="opt-sub">기본은 제외 · 켜면 10회 이상 팩 중 잔여 있는 분만 포함 · 횟수권 관리 탭은 이 토글과 무관하게 항상 전체 표시</span>
  </div>
  <div id="bootStatus" class="wklab" style="margin-top:8px">회원 데이터 불러오는 중…</div>
</div>

<div class="tabnav">
  <button class="tabbtn on" id="tabbtn-dash" onclick="switchTab('dash')">👥 전체 회원</button>
  <button class="tabbtn" id="tabbtn-bulk" onclick="switchTab('bulk')">📤 단체문자(단톡방 제외)</button>
  <button class="tabbtn" id="tabbtn-pass" onclick="switchTab('pass')">🎫 횟수권 관리</button>
</div>

<!-- ===== 탭 1: 전체 회원 대시보드 ===== -->
<div id="tabpane-dash" class="tabpane on">
  <div class="card">
    <div class="filterrow">
      <input id="dashSearch" type="text" placeholder="🔍 이름 또는 번호로 찾기" oninput="renderDashboard()">
      <select id="dashPlanFilter" onchange="renderDashboard()"><option value="">전체 회원권</option></select>
      <select id="dashSort" onchange="renderDashboard()">
        <option value="name">이름순</option>
        <option value="plan">회원권별</option>
        <option value="att_desc">출석 많은순</option>
        <option value="att_asc">출석 적은순</option>
        <option value="exp">만료 임박순</option>
      </select>
    </div>
  </div>
  <div id="dashResult"></div>
</div>

<!-- ===== 탭 2: 단체문자 (단톡방 제외) ===== -->
<div id="tabpane-bulk" class="tabpane">
  <div class="card">
    <div class="wklab">단톡방 멤버 명단 붙여넣기 (한 줄에 한 명씩)</div>
    <textarea id="gcNames" placeholder="백승헌
이기찬
강문철
..."></textarea>
    <button class="btn" onclick="runBulkMatch()">매칭하기</button>
    <div id="bulkStatus" class="wklab" style="margin-top:8px"></div>
  </div>
  <div id="ambSection"></div>
  <div id="exclSection"></div>
  <div class="card" id="bulkSortCard" style="display:none">
    <div class="filterrow">
      <select id="bulkPlanFilter" onchange="renderBulkResult()"><option value="">전체 회원권</option></select>
      <select id="bulkSort" onchange="renderBulkResult()">
        <option value="name">이름순</option>
        <option value="plan">회원권별</option>
        <option value="att_desc">출석 많은순</option>
        <option value="att_asc">출석 적은순</option>
        <option value="exp">만료 임박순</option>
      </select>
    </div>
  </div>
  <div id="bulkResult"></div>
</div>

<!-- ===== 탭 3: 횟수권 관리 ===== -->
<div id="tabpane-pass" class="tabpane">
  <div class="card">
    <div class="listhead" style="margin:0">🎫 횟수권(클래스팩) 보유자 전체 · 만료 임박순 정렬 · 페이스 = 예정 사용속도 대비 실제 사용속도</div>
  </div>
  <div id="passResult"></div>
</div>

<div id="detailModal" onclick="if(event.target.id==='detailModal')closeDetail()">
  <div id="detailSheet"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://mvgbwsbvngdnxdndwimb.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_ZRHS4-UR7Q07Fmtc_P-19g_fVlIc85X";
const TOKEN = new URLSearchParams(location.search).get('key') || '';
const sb = supabase.createClient(SUPABASE_URL, PUBLISHABLE_KEY, {global:{headers:{'x-app-token':TOKEN}}});

function esc(s){return (s||'').toString().replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function photoOf(m){ return m.photo_url||m.glofox_photo||''; }
function miniAvatar(m){
  const p=photoOf(m);
  const initial=(m.name||'?').trim().slice(-2);
  return p ? `<span class="ph"><img src="${esc(p)}" onerror="this.parentElement.innerHTML='${esc(initial)}'"></span>` : `<span class="ph">${esc(initial)}</span>`;
}
function isClassPass(m){
  const t=m.membership||'';
  return t.includes('횟수권')||t.includes('Class Pass');
}
function expiryOf(m){ return isClassPass(m) ? (m.pass_expiry||null) : (m.end_date||null); }
function ddayOf(ed, today){
  if(!ed||ed.length<10)return null;
  return Math.round((new Date(ed.slice(0,10)+'T00:00:00')-new Date(today+'T00:00:00'))/86400000);
}
function expiryHTML(m, today){
  const ed=expiryOf(m);
  if(!ed||ed.length<10) return '<span style="color:var(--dim)">-</span>';
  const dd=ddayOf(ed,today);
  const short=ed.slice(2,10).replace(/-/g,'.');
  if(dd<0) return `<span style="color:#e0563a">만료 ${short}</span>`;
  if(dd<=14) return `<span style="color:#e0563a">D-${dd}</span>`;
  if(dd<=30) return `<span style="color:#e0954f">${short}</span>`;
  return `<span style="color:var(--dim)">${short}</span>`;
}

function payMember(m){
  const t=m.membership||'';
  if(t.includes('무료혜택')||t.includes('Complimentary'))return false;
  if(isClassPass(m)){
    const total=m.pass_total||0; const remain=(m.pass_remaining!=null)?m.pass_remaining:total;
    return total>=10 && remain>0;
  }
  return true;
}
function eligibleActive(m, today){
  if(m.stage!=='회원')return false;
  const inclPass = document.getElementById('inclPass')?.checked;
  if(isClassPass(m)){
    if(!inclPass) return false;
    if(!payMember(m)) return false;
  } else {
    if(!payMember(m)) return false;
  }
  const ed=m.end_date&&m.end_date.length>=10?m.end_date.slice(0,10):null;
  if(ed&&ed<today)return false;
  return true;
}

function norm(s){ return (s||'').toString().trim().toLowerCase().replace(/\s+/g,''); }
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(!m)return n; if(!n)return m;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  }
  return dp[m][n];
}
function matchOne(groupName, activeMembers){
  const g=norm(groupName);
  if(g.length<1)return {tier:0};
  let confident=null, ambiguous=[];
  activeMembers.forEach(m=>{
    const nm=norm(m.name);
    if(!nm)return;
    if(nm===g){ confident=m; return; }
    if(g.length<=2){ return; }
    if(nm.includes(g)||g.includes(nm)){ ambiguous.push(m); return; }
    if(nm.length>=2 && nm.length<=6 && levenshtein(nm,g)<=1){ ambiguous.push(m); return; }
  });
  if(confident) return {tier:1, member:confident};
  if(ambiguous.length) return {tier:2, candidates:ambiguous};
  return {tier:0};
}

// ===== 전역 상태 =====
let PEOPLE_CACHE=null, ATT_CACHE=null, TODAY_CACHE=null, PEOPLE_MAP={};
let ACTIVE=[];
let EXCLUDE=new Set(), AMBIGUOUS=[], UNMATCHED=[];
let PASS_LIST=[];

async function boot(){
  const status=document.getElementById('bootStatus');
  if(!TOKEN){
    status.innerHTML='⚠️ URL에 <b>?key=열쇠값</b>이 없어요. f45app.html 열 때 쓰는 것과 같은 key를 이 페이지 주소 끝에 붙여서 열어주세요.';
    return;
  }
  try{
    const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
    TODAY_CACHE=today;

    let people=[],pf=0;
    while(true){
      const {data,error}=await sb.from('people').select('*').range(pf,pf+999);
      if(error){status.textContent='불러오기 실패: '+error.message;return;}
      people=people.concat(data||[]);
      if(!data||data.length<1000)break; pf+=1000;
    }
    people.forEach(p=>{ if(p.name_override)p.name=p.name_override; });

    if(people.length===0){
      status.innerHTML=`⚠️ people 테이블에서 데이터가 0건 왔어요. ?key= 값을 확인해주세요.`;
      return;
    }
    PEOPLE_CACHE=people;
    PEOPLE_MAP={};
    people.forEach(p=>{ if(p.glofox_user_id) PEOPLE_MAP[p.glofox_user_id]=p; });

    const since=new Date(today+'T00:00:00'); since.setDate(since.getDate()-35);
    let att=[],af=0;
    while(true){
      const {data,error}=await sb.from('attendance').select('glofox_user_id,class_time,attended')
        .eq('attended',true).gte('class_time',since.toISOString()).range(af,af+999);
      if(error)break;
      att=att.concat(data||[]);
      if(!data||data.length<1000)break; af+=1000;
    }
    const daysByUid={};
    att.forEach(a=>{
      const uid=a.glofox_user_id; if(!uid)return;
      const ds=String(a.class_time||'').slice(0,10);
      (daysByUid[uid]=daysByUid[uid]||new Set()).add(ds);
    });
    ATT_CACHE=daysByUid;
    people.forEach(p=>{ if(p.glofox_user_id) p._days = daysByUid[p.glofox_user_id] || new Set(); });

    computeActive();
    computePassList();
    populatePlanFilter('dashPlanFilter', ACTIVE);
    populatePlanFilter('bulkPlanFilter', ACTIVE);
    status.textContent=`✅ 불러오기 완료 · 활성 회원 ${ACTIVE.length}명 · 횟수권 보유자 ${PASS_LIST.length}명`;
    renderDashboard();
  }catch(e){
    status.textContent='오류: '+e.message;
  }
}

function populatePlanFilter(selectId, list){
  const sel=document.getElementById(selectId);
  if(!sel)return;
  const plans=[...new Set(list.map(m=>m.membership||'(없음)'))].sort((a,b)=>a.localeCompare(b,'ko'));
  const cur=sel.value;
  sel.innerHTML='<option value="">전체 회원권</option>'+plans.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
  if(plans.includes(cur)) sel.value=cur;
}

function computeActive(){
  const today=TODAY_CACHE;
  const active=(PEOPLE_CACHE||[]).filter(m=>m.glofox_user_id&&eligibleActive(m,today));
  ACTIVE=active;
  return active;
}
function computePassList(){
  PASS_LIST=(PEOPLE_CACHE||[]).filter(m=>m.glofox_user_id&&(m.pass_remaining!=null||isClassPass(m)));
  return PASS_LIST;
}
function onToggleChange(){
  if(!PEOPLE_CACHE)return;
  computeActive();
  populatePlanFilter('dashPlanFilter', ACTIVE);
  populatePlanFilter('bulkPlanFilter', ACTIVE);
  const status=document.getElementById('bootStatus');
  status.textContent=`✅ 활성 회원 ${ACTIVE.length}명 · 횟수권 보유자 ${PASS_LIST.length}명`;
  const cur=['dash','bulk','pass'].find(x=>document.getElementById('tabpane-'+x).classList.contains('on'));
  if(cur==='dash') renderDashboard();
  else if(cur==='bulk' && document.getElementById('gcNames').value.trim()) runBulkMatch();
}

function switchTab(t){
  ['dash','bulk','pass'].forEach(x=>{
    document.getElementById('tabpane-'+x).classList.toggle('on', x===t);
    document.getElementById('tabbtn-'+x).classList.toggle('on', x===t);
  });
  if(t==='pass') renderPassTab();
}

// ===== 정렬 =====
function attendanceScore(m, today){
  const days=m._days||new Set();
  const t=new Date(today+'T00:00:00');
  const dow=(t.getDay()+6)%7; const mon=new Date(t); mon.setDate(t.getDate()-dow);
  let cnt=0;
  for(let w=3;w>=0;w--)for(let d=0;d<6;d++){
    const cur=new Date(mon); cur.setDate(mon.getDate()-w*7+d);
    if(cur>t)continue;
    if(days.has(fmt(cur)))cnt++;
  }
  return cnt;
}
function sortMembers(list, mode, today){
  const arr=list.slice();
  if(mode==='plan'){
    arr.sort((a,b)=>(a.membership||'').localeCompare(b.membership||'','ko')||(a.name||'').localeCompare(b.name||'','ko'));
  } else if(mode==='att_desc'){
    arr.sort((a,b)=>attendanceScore(b,today)-attendanceScore(a,today)||(a.name||'').localeCompare(b.name||'','ko'));
  } else if(mode==='att_asc'){
    arr.sort((a,b)=>attendanceScore(a,today)-attendanceScore(b,today)||(a.name||'').localeCompare(b.name||'','ko'));
  } else if(mode==='exp'){
    arr.sort((a,b)=>{
      const ea=expiryOf(a), eb=expiryOf(b);
      if(!ea&&!eb)return 0; if(!ea)return 1; if(!eb)return -1;
      return ea.localeCompare(eb);
    });
  } else {
    arr.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));
  }
  return arr;
}

// ===== 공용 테이블 렌더러 =====
function memberTableHTML(list, today, containerId){
  let h=`<div class="toolbar">
    <label><input type="checkbox" id="${containerId}-chkAll" onchange="tblToggleAll('${containerId}',this.checked)"> 전체 선택</label>
    <span class="count-pill" id="${containerId}-selCount"><b>0</b>명 선택됨</span>

// ===== 탭 2: 단체문자 =====
function runBulkMatch(){
  const status=document.getElementById('bulkStatus');
  if(!PEOPLE_CACHE){ status.textContent='아직 회원 데이터를 불러오는 중이에요. 잠시 후 다시 눌러주세요.'; return; }
  const raw=document.getElementById('gcNames').value||'';
  const names=raw.split('\n').map(s=>s.trim()).filter(Boolean);
  const seen=new Set();
  EXCLUDE=new Set(); AMBIGUOUS=[]; UNMATCHED=[];

  names.forEach(gn=>{
    if(seen.has(gn))return; seen.add(gn);
    const r=matchOne(gn, ACTIVE);
    if(r.tier===1){ EXCLUDE.add(r.member.glofox_user_id); }
    else if(r.tier===2){ AMBIGUOUS.push({groupName:gn, candidates:r.candidates}); }
    else { UNMATCHED.push(gn); }
  });

  status.textContent=`완료: 활성 회원 ${ACTIVE.length}명 중 확실 매칭 ${EXCLUDE.size}건, 확인 필요 ${AMBIGUOUS.length}건`;
  document.getElementById('bulkSortCard').style.display='';
  renderAmbiguous();
  renderExcluded();
  renderBulkResult();
}
function renderAmbiguous(){
  const box=document.getElementById('ambSection');
  if(!AMBIGUOUS.length){ box.innerHTML=''; return; }
  let h=`<div class="listhead">⚠️ <b>확인이 필요해요</b> ${AMBIGUOUS.length}건 · 단톡방 이름과 비슷한 회원이에요. 맞으면 눌러서 제외하세요.</div>`;
  h+=AMBIGUOUS.map(a=>{
    const rows=a.candidates.map(m=>{
      const on=EXCLUDE.has(m.glofox_user_id);
      return `<div class="amb-row">
        <div class="who"><b>${esc(m.name)}</b><span>${esc(m.phone||'번호없음')}</span></div>
        <button class="amb-btn ${on?'on':''}" onclick="toggleExclude('${m.glofox_user_id}')">${on?'제외됨 ✓':'같은 사람 (제외)'}</button>

    }).join('');
    return `<div class="card" style="margin-bottom:8px"><div style="font-size:13px;margin-bottom:6px">단톡방 "<b>${esc(a.groupName)}</b>" 님과 비슷한 회원</div>${rows}</div>`;
  }).join('');
  box.innerHTML=h;
}

// ===== 탭 3: 횟수권 관리 =====
function passPace(m, todayStr){
  const tot=+(m.pass_total||0), rem=+(m.pass_remaining||0);
  const st=m.pass_start, ex=m.pass_expiry;
  if(!tot||!st||!ex||st.length<10||ex.length<10) return null;
  const tnow=new Date(todayStr+'T00:00:00');
  const s=new Date(st.slice(0,10)+'T00:00:00'), e=new Date(ex.slice(0,10)+'T00:00:00');
  const totDays=(e-s)/86400000; const elapsed=(tnow-s)/86400000;
  if(totDays<=0) return null;
  const frac=Math.min(Math.max(elapsed/totDays,0),1);
  const expUsed=tot*frac;
  const expRem=tot-expUsed;
  const diff=rem-expRem;
  return {expUsed:Math.round(expUsed), expRem:Math.round(expRem), diff:Math.round(diff), usedActual:tot-rem};
}
function paceHTML(m, todayStr){
  const rem=m.pass_remaining;
  const p=passPace(m, todayStr);
  if(rem<=0) return '<span style="color:#e0563a">소진 완료</span>';
  if(!p) return '<span style="color:var(--dim)">-</span>';
  if(p.diff>1.5) return `<span style="color:#e0954f">예정보다 ${p.diff}회 더 남음(느림)</span>`;
  if(p.diff<-1.5) return `<span style="color:#5aa0e0">예정보다 ${-p.diff}회 적게 남음(빠름)</span>`;
  return `<span style="color:var(--grn)">적정 페이스</span>`;
}

    return `<div class="trow" style="cursor:pointer" onclick="showDetail('${m.glofox_user_id}')">

      <div class="c-photo">${miniAvatar(m)}</div>

  }).join('');
  h+=`</div>

// ===== 4주 출석 그리드 =====
// ===== 최근 N일 출석 횟수 =====
function countDaysWithin(days, today, n){
  if(!days)return 0;
  const t=new Date(today+'T00:00:00');
  const lim=new Date(t); lim.setDate(t.getDate()-n);
  let c=0;
  days.forEach(d=>{ if(new Date(d+'T00:00:00')>lim) c++; });
  return c;
}
function seasonalHint(todayStr){
  const mo=+todayStr.slice(5,7);
  if([12,1,2].includes(mo)) return '한겨울, 추운 날씨';
  if([3,4,5].includes(mo)) return '봄, 날씨가 풀리는 시기';
  if([6,7,8].includes(mo)) return '한여름, 더운 날씨';
  if(mo===9) return '초가을, 선선해지기 시작하는 시기';
  if([10,11].includes(mo)) return '가을, 선선하고 쌀쌀해지는 시기';
  return '';
}

// ===== AI 문구 생성 (기존 f45app.html과 같은 glofox-ai Edge Function 재사용) =====
async function aiMsgFor(uid, btn, situationHint){
  const m=tblMemberByUid(uid);
  if(!m)return;
  const today=TODAY_CACHE;
  const r7=countDaysWithin(m._days, today, 7);
  const r14=countDaysWithin(m._days, today, 14);
  const season=seasonalHint(today);

  let detail=`오늘 날짜 ${today} (${season}). 최근 7일 출석 ${r7}회, 최근 14일 출석 ${r14}회.`;
  if(r14<=1) detail+=' 최근 거의 안 나오고 있음 - 부담 주지 않고 부드럽게 다시 나오도록 안부 겸 독려.';
  else if(r14>=6) detail+=' 최근 꾸준히 잘 나오고 있음 - 칭찬과 격려 위주.';
  else detail+=' 출석이 보통 수준 - 가볍게 안부 겸 독려.';

  let situation='최근 출석 패턴에 맞춰 안부/독려 문자. 날씨·계절 변화를 자연스럽게 한 마디 녹여서 (예: 선선해졌는데 다시 나와보시라는 식) 작성.';
  if(situationHint==='pass' && isClassPass(m)){
    const dd=ddayOf(m.pass_expiry, today);
    detail+=` 횟수권 잔여 ${m.pass_remaining}회, 만료까지 ${dd!=null?dd+'일':'-'} 남음.`;
    situation='횟수권 만료 전 소진을 부드럽게 유도하는 문자. 날씨·계절 변화도 자연스럽게 한 마디.';
  }

  if(btn){btn.disabled=true;btn.textContent='...';}
  try{
    const {data,error}=await sb.functions.invoke('glofox-ai',{body:{type:'message',name:m.name||'회원',situation,detail}});
    if(btn){btn.disabled=false;btn.textContent='🤖AI';}
    if(error||!data?.text){ alert('AI 문구 생성 실패: '+(error?.message||'응답을 받지 못했어요')); return; }
    showAiModal(uid, data.text);
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='🤖AI';}
    alert('오류: '+e.message);
  }
}

function weekBlocksHTML(days, today){
  const t=new Date(today+'T00:00:00');
  const dow=(t.getDay()+6)%7; const mon=new Date(t); mon.setDate(t.getDate()-dow);
  let out='';
  for(let w=3;w>=0;w--){
    let grp='<div class="wkgrp">';
    for(let d=0;d<6;d++){
      const cur=new Date(mon); cur.setDate(mon.getDate()-w*7+d);
      const ds=fmt(cur);
      const has=(days||new Set()).has(ds);
      const fut=cur>t;
      grp+=`<span class="dsq ${has?'on':''} ${fut?'fut':''}" title="${ds}"></span>`;
    }
    grp+='</div>';
    out+=grp;
  }
  return out;
}

  `;
  document.getElementById('detailModal').classList.add('show');
}
function closeDetail(){

}
