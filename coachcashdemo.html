<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1420">
<title>코치캐시 (데모) · 이름 맞히기</title>
<style>
:root{
  --bg:#0d1420; --card:#16203200; --line:#22304a; --txt:#e8eef7; --dim:#8d9bb2;
  --grn:#4ee88a; --red:#ff5c5c; --acc:#5aa0e0; --gold:#ffd166;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:radial-gradient(1200px 600px at 50% -10%,#1b2942 0%,var(--bg) 55%);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  user-select:none;
}

/* ===== 공통 화면 ===== */
.screen{flex:1;display:none;flex-direction:column;animation:fadeIn .35s ease both}
.screen.on{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.center{margin:auto;text-align:center;padding:24px}
.btn{
  border:none;border-radius:16px;padding:16px 22px;font-size:16px;font-weight:800;
  background:linear-gradient(135deg,#3f7fd4,#5aa0e0);color:#fff;
  box-shadow:0 8px 22px rgba(63,127,212,.35);
  transition:transform .12s cubic-bezier(.2,.9,.3,1.3),box-shadow .2s;
  cursor:pointer;
}
.btn:active{transform:scale(.94);box-shadow:0 3px 10px rgba(63,127,212,.3)}
.btn.gold{background:linear-gradient(135deg,#e8a93a,#ffd166);color:#2a1d00;box-shadow:0 8px 22px rgba(255,209,102,.3)}
.btn.ghost{background:#1a2740;color:var(--txt);box-shadow:none;border:1px solid var(--line)}

/* ===== 상단 HUD ===== */
#hud{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
#bar{flex:1;height:8px;background:#1a2740;border-radius:99px;overflow:hidden}
#barfill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--grn));border-radius:99px;transition:width .45s cubic-bezier(.2,.9,.3,1)}
#qn{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
#streak{font-size:13px;font-weight:800;color:var(--gold);min-width:40px}

/* ===== 카드 ===== */
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:6px 18px}
.card{
  position:absolute;width:min(78vw,300px);aspect-ratio:3/4;border-radius:26px;overflow:hidden;
  background:#101a2b;border:1px solid var(--line);
  box-shadow:0 24px 60px rgba(0,0,0,.55);
  will-change:transform,opacity;
}
.card img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.card .initial{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:76px;font-weight:900;color:#43608c;background:linear-gradient(160deg,#16223a,#0f1828)}

/* 뒤에 쌓인 카드(깊이감) */
.card.behind1{transform:scale(.94) translateY(14px);opacity:.55;filter:blur(1px)}
.card.behind2{transform:scale(.88) translateY(28px);opacity:.3;filter:blur(2px)}

/* 정답/오답 연출 */
@keyframes flyRight{to{transform:translateX(130%) rotate(18deg);opacity:0}}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-14px) rotate(-3deg)}
  30%{transform:translateX(12px) rotate(3deg)}
  45%{transform:translateX(-9px) rotate(-2deg)}
  60%{transform:translateX(7px) rotate(1.5deg)}
  80%{transform:translateX(-3px)}
}
.card.correct{animation:flyRight .42s cubic-bezier(.4,0,.6,1) forwards}
.card.wrong{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
.card .flash{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .18s}
.card.correct .flash{background:radial-gradient(circle,rgba(78,232,138,.45),transparent 70%);opacity:1}
.card.wrong .flash{background:radial-gradient(circle,rgba(255,92,92,.4),transparent 70%);opacity:1}

/* ===== 보기 버튼 ===== */
#choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.ch{
  border:1px solid var(--line);background:#16223a;color:var(--txt);
  border-radius:16px;padding:16px 10px;font-size:16px;font-weight:700;
  transition:transform .12s cubic-bezier(.2,.9,.3,1.3),background .2s,border-color .2s;
  cursor:pointer;
}
.ch:active{transform:scale(.95)}
.ch:nth-child(5){grid-column:1/-1}
.ch.ok{background:rgba(78,232,138,.18);border-color:var(--grn);color:var(--grn)}
.ch.no{background:rgba(255,92,92,.15);border-color:var(--red);color:var(--red)}
.ch.dim{opacity:.35}

/* ===== 결과 ===== */
.bigscore{font-size:60px;font-weight:900;letter-spacing:-2px;line-height:1}
.cashline{font-size:34px;font-weight:900;color:var(--gold);margin-top:6px}
.sub{color:var(--dim);font-size:14px;line-height:1.7}
.pill{display:inline-block;background:#16223a;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;margin:4px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}

/* 종이꽃가루 */
.confetti{position:fixed;top:-12px;width:9px;height:14px;opacity:.95;pointer-events:none;z-index:99;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<!-- 시작 -->
<div id="sc-start" class="screen on">
 <div class="center">
  <div style="font-size:52px" class="pop">🧠</div>
  <h1 style="margin:10px 0 4px;font-size:26px">코치캐시</h1>
  <div class="sub">회원 얼굴 보고 이름 맞히기<br>오늘 참여하면 캐시가 쌓여요</div>
  <div style="margin:18px 0">
   <span class="pill">참여만 해도 <b style="color:var(--gold)">1,000원</b></span>
   <span class="pill">60% 이상 <b style="color:var(--gold)">2,000원</b></span>
   <span class="pill">만점 <b style="color:var(--gold)">3,000원</b></span><div style="font-size:12px;color:var(--dim);margin-top:8px">문제당 5초 · 시간 지나면 오답 처리돼요</div>
  </div>
  <div id="startMsg" class="sub" style="margin-bottom:16px">준비 중…</div>
  <button id="startBtn" class="btn gold" style="display:none" onclick="startGame()">시작하기</button>
  <div id="myCash" class="sub" style="margin-top:18px"></div>
 </div>
</div>

<!-- 게임 -->
<div id="sc-play" class="screen">
 <div id="hud">
  <div id="streak"></div>
  <div id="bar"><div id="barfill"></div></div>
  <div id="qn"></div>
  <div id="tmr" style="font-size:15px;font-weight:900;min-width:30px;text-align:right"></div>
 </div>
 <div id="stage"></div>
 <div id="choices"></div>
</div>

<!-- 결과 -->
<div id="sc-done" class="screen">
 <div class="center">
  <div id="doneEmoji" style="font-size:54px" class="pop"></div>
  <div id="doneScore" class="bigscore pop"></div>
  <div id="doneAcc" class="sub" style="margin-top:6px"></div>
  <div id="doneCash" class="cashline pop"></div>
  <div id="doneNote" class="sub" style="margin-top:10px"></div>
  <div id="doneWrong" style="margin-top:14px"></div>
  <div style="margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
   <button class="btn ghost" onclick="location.reload()">다시 하기</button>
  </div>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://mvgbwsbvngdnxdndwimb.supabase.co';
const SB_KEY='sb_publishable_ZRHS4-UR7Q07Fmtc_P-19g_fVlIc85X';
// 본앱(f45app)과 동일하게 x-app-token 헤더를 붙여야 RLS를 통과함.
// 이게 없으면 에러 없이 조용히 0건이 돌아와서 "사진 등록된 회원 0명"으로 보임.
const APP_TOKEN=new URLSearchParams(location.search).get('key')||'f45sujong-2026';
const sb=supabase.createClient(SB_URL,SB_KEY,{global:{headers:{'x-app-token':APP_TOKEN}}});

let QN=10;
let POOL=[],ALLNAMES=[],SCOPE='',QUIZ=[],IDX=0,CORRECT=0,STREAK=0,BEST=0,WRONGS=[],LOCK=false;

const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function photoOf(m){return m.photo_url||m.glofox_photo||'';}
function kstDate(d){return d.toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});}
function kstHour(iso){return +new Date(iso).toLocaleTimeString('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',hour12:false});}

// Supabase는 한 번에 최대 1000행만 주므로 나눠서 전부 받아옴 (이거 없으면 앞쪽 1000명만 읽혀서 사진 있는 회원이 0명으로 나옴)
let DIAG={total:0,withPhoto:0,named:0};
async function fetchPhotoMembers(){
 // 본앱(loadData)과 동일하게 people 전체를 1000행씩 나눠 받아옴 (서버측 필터는 쓰지 않음)
 let out=[],from=0;
 while(true){
  const{data,error}=await sb.from('people').select('*').range(from,from+999);
  if(error)throw error;
  out=out.concat(data||[]);
  if(!data||data.length<1000)break;
  from+=1000;
 }
 DIAG.total=out.length;
 const mapped=out.map(m=>({uid:m.glofox_user_id,name:(m.name_override||m.name||'').trim(),photo:photoOf(m),stage:m.stage}));
 DIAG.withPhoto=mapped.filter(m=>m.photo).length;
 const res=mapped.filter(m=>m.uid&&m.name&&m.photo&&m.stage!=='리드');
 DIAG.named=res.length;
 return res;
}

(async function init(){
 $('startMsg').textContent='어제 저녁 수업 참석자를 불러오는 중…';
 let all=[];
 try{ all=await fetchPhotoMembers(); }
 catch(e){ $('startMsg').textContent='회원 정보를 못 불러왔어요: '+e.message; return; }
 ALLNAMES=all;

 // 어제부터 최대 7일 거슬러 올라가며 "저녁(17시 이후) 수업 참석자"가 있는 날 찾기
 let found=null;
 for(let back=1;back<=7&&!found;back++){
  const d=new Date(); d.setDate(d.getDate()-back);
  const day=kstDate(d);
  try{
   const{data}=await sb.from('attendance').select('glofox_user_id,class_time')
    .eq('attended',true).gte('class_time',day+'T00:00:00').lte('class_time',day+'T23:59:59').limit(500);
   const uids=[...new Set((data||[]).filter(a=>kstHour(a.class_time)>=17).map(a=>a.glofox_user_id))];
   const pool=all.filter(m=>uids.includes(m.uid));
   if(pool.length>=6) found={day,pool};
  }catch(e){}
 }

 if(found){ POOL=found.pool; SCOPE=`${found.day.slice(5).replace('-','/')} 저녁 수업 참석자`; }
 else { POOL=all; SCOPE='전체 회원(저녁 참석자 데이터 부족)'; }

 if(POOL.length<6){ $('startMsg').innerHTML=`퀴즈를 만들 수 없어요 (대상 ${POOL.length}명)<br><span style="font-size:12px">전체 ${DIAG.total}명 · 사진있음 ${DIAG.withPhoto}명 · 출제가능 ${DIAG.named}명</span>`; return; }

 QN=Math.min(15,POOL.length);
 $('startMsg').innerHTML=`<b>데모 모드</b> · 출제 범위: <b style="color:var(--acc)">${esc(SCOPE)}</b> (${POOL.length}명)`
  +`<div style="margin-top:12px;font-size:13px">문항 수 선택</div>`
  +`<div id="qnSel" style="display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap"></div>`;
 renderQnSel();
 $('startBtn').style.display='inline-block';
 $('myCash').innerHTML='<span style="font-size:12px">데모라 실제로 적립되지 않아요</span>';
})();

function renderQnSel(){
 const opts=[10,15,20,POOL.length].filter((v,i,a)=>v<=POOL.length&&a.indexOf(v)===i).sort((a,b)=>a-b);
 $('qnSel').innerHTML=opts.map(n=>{
  const full=(n===POOL.length&&POOL.length>15);
  return `<button class="ch" style="padding:8px 14px;font-size:14px;${QN===n?'border-color:var(--acc);color:var(--acc)':''}${full?';border-color:#ffd166':''}" onclick="QN=${n};renderQnSel()">${full?`🔥 끝까지 ${n}`:n+'문항'}</button>`;
 }).join('')
 + (POOL.length>15?`<div style="width:100%;font-size:12px;color:#ffd166;margin-top:6px">전체(${POOL.length}문항) 완주하면 <b>+500원</b> 추가 적립!</div>`:'');
}

function startGame(){
 const picks=shuffle(POOL.slice()).slice(0,QN);
 QUIZ=picks.map(ans=>{
  const src=(ALLNAMES.length?ALLNAMES:POOL);
  const others=shuffle(src.filter(p=>p.uid!==ans.uid&&p.name!==ans.name)).slice(0,4);
  return{ans,choices:shuffle([ans,...others])};
 });
 IDX=0;CORRECT=0;STREAK=0;BEST=0;WRONGS=[];LOCK=false;
 show('sc-play');
 renderQ();
}

const LIMIT=5; // 문제당 제한시간(초) - 찾아보고 답하는 걸 막기 위함
let TID=null,TLEFT=0;
function stopTimer(){ if(TID){clearInterval(TID);TID=null;} }
function startTimer(){
 stopTimer(); TLEFT=LIMIT;
 const el=$('tmr'); if(el){el.textContent=TLEFT;el.style.color='var(--dim)';}
 TID=setInterval(()=>{
  TLEFT--;
  const e2=$('tmr');
  if(e2){ e2.textContent=Math.max(0,TLEFT); e2.style.color=TLEFT<=2?'var(--red)':'var(--dim)'; }
  if(TLEFT<=0){ stopTimer(); if(!LOCK) answer(-1); }
 },1000);
}
function renderQ(){
 const q=QUIZ[IDX];
 $('qn').textContent=`${IDX+1}/${QN}`;
 $('barfill').style.width=((IDX)/QN*100)+'%';
 $('streak').textContent=STREAK>=2?`🔥${STREAK}`:'';
 let html='';
 for(let k=2;k>=0;k--){
  const qq=QUIZ[IDX+k]; if(!qq)continue;
  const cls=k===0?'card':(k===1?'card behind1':'card behind2');
  const id=k===0?'id="curcard"':'';
  html+=`<div class="${cls}" ${id}><img src="${esc(qq.ans.photo)}" alt="" onerror="this.style.visibility='hidden'"><div class="flash"></div></div>`;
 }
 $('stage').innerHTML=html;
 $('choices').innerHTML=q.choices.map((c,i)=>
  `<button class="ch" data-i="${i}" onclick="answer(${i})">${esc(c.name)}</button>`).join('');
 startTimer();
}

function answer(i){
 if(LOCK)return; LOCK=true; stopTimer();
 const el=$('tmr'); if(el)el.textContent='';
 try{
  const q=QUIZ[IDX];
  const timeout=(i<0);
  const ok=!timeout && q.choices[i] && q.choices[i].uid===q.ans.uid;
  document.querySelectorAll('.ch').forEach((b,bi)=>{
   const c=q.choices[bi];
   if(c&&c.uid===q.ans.uid)b.classList.add('ok');
   else if(bi===i)b.classList.add('no');
   else b.classList.add('dim');
  });
  const card=$('curcard');
  if(ok){CORRECT++;STREAK++;BEST=Math.max(BEST,STREAK);card&&card.classList.add('correct');buzz(18);}
  else{STREAK=0;WRONGS.push(q.ans);card&&card.classList.add('wrong');buzz([40,50,40]);}
  $('barfill').style.width=((IDX+1)/QN*100)+'%';
  setTimeout(()=>{ IDX++; LOCK=false; if(IDX>=QN)finish(); else renderQ(); }, ok?520:1050);
 }catch(e){
  // 어떤 이유로든 오류가 나도 게임이 멈추지 않게 다음 문제로 넘어감
  console.error('answer error',e);
  setTimeout(()=>{ IDX++; LOCK=false; if(IDX>=QN)finish(); else renderQ(); },400);
 }
}

function rewardFor(acc){ if(acc>=100)return 3000; if(acc>=60)return 2000; return 1000; }
// 전체 문항 완주 시 보너스 (풀이 15명 넘을 때만 의미있음)
function fullBonus(){ return (POOL.length>15 && QN===POOL.length) ? 500 : 0; }

function finish(){
 stopTimer(); const te=$('tmr'); if(te)te.textContent='';
 const acc=Math.round(CORRECT/QN*100);
 const bonus=fullBonus();
 const reward=rewardFor(acc)+bonus;
 show('sc-done');
 $('doneEmoji').textContent=acc>=100?'🏆':(acc>=60?'👏':'💪');
 $('doneScore').textContent=`${CORRECT} / ${QN}`;
 $('doneAcc').innerHTML=`정답률 <b>${acc}%</b>${BEST>=3?` · 최고 연속 🔥${BEST}`:''}`;
 $('doneCash').innerHTML=`+${reward.toLocaleString()}원`+(bonus?`<div style="font-size:13px;color:var(--grn);font-weight:700">🔥 끝까지 도전 보너스 +${bonus}원 포함</div>`:'');
 if(acc>=100){confetti();buzz([30,40,30,40,60]);}
 if(WRONGS.length){
  $('doneWrong').innerHTML='<div class="sub" style="margin-bottom:6px">이 분들 이름 한 번 더!</div>'
   +WRONGS.map(w=>`<span class="pill">${esc(w.name)}</span>`).join('');
 }
 $('doneNote').innerHTML='<b>데모 모드</b>라 실제로 적립되지는 않아요.';
}

function confetti(){
 const cols=['#4ee88a','#ffd166','#5aa0e0','#ff7ab6','#b07cff'];
 for(let i=0;i<60;i++){
  const d=document.createElement('div');
  d.className='confetti';
  d.style.left=Math.random()*100+'vw';
  d.style.background=cols[i%cols.length];
  d.style.animation=`fall ${1.6+Math.random()*1.4}s linear ${Math.random()*.5}s forwards`;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),3600);
 }
}
</script>
</body>
</html>
